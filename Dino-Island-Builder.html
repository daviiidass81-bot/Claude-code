<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dino Island Builder</title>
<meta name="description" content="Build your own prehistoric theme park: clear the jungle, decode amber, hatch dinosaurs and battle in the arena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* ==========================================================
   Dino Island Builder – UI styles
   ========================================================== */
:root {
  --jungle-900: #0d1a0f;
  --jungle-800: #14261a;
  --jungle-700: #1d3624;
  --jungle-600: #284a31;
  --jungle-500: #36623f;
  --leaf: #7dc15a;
  --leaf-hi: #b6e27a;
  --amber: #f5a623;
  --amber-hi: #ffd479;
  --amber-lo: #a8600d;
  --wood: #6b4424;
  --wood-hi: #9b6a3c;
  --wood-lo: #3e2512;
  --cream: #fff4dc;
  --ink: #1b140c;
  --red: #e0513a;
  --blue: #4aa8e0;
  --panel: rgba(18, 32, 21, .92);
  --panel-brd: #c99a45;
  --shadow: 0 8px 24px rgba(0,0,0,.45);
  --font-head: 'Lilita One', 'Trebuchet MS', 'Arial Black', sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3b52; color: var(--cream); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
.hidden { display: none !important; }

/* ---------- buttons ---------- */
.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-family: var(--font-head); font-size: 18px; letter-spacing: .5px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); position: relative; transition: transform .08s, filter .15s; box-shadow: 0 4px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35); }
.btn:disabled { filter: grayscale(.85) brightness(.75); cursor: not-allowed; }
.btn-gold { background: linear-gradient(#ffcf5a, #e8911a 60%, #c46d06); color: #3a1d00; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
.btn-green { background: linear-gradient(#8fdc5b, #4c9e2f 60%, #2f7119); }
.btn-red { background: linear-gradient(#ff8a6a, #d6452c 60%, #9e2a17); }
.btn-blue { background: linear-gradient(#8fd6ff, #3a92d0 60%, #1f5f94); }
.btn-wood { background: linear-gradient(#b07a45, #7a4d25 60%, #563217); }
.btn-small { font-size: 14px; padding: 7px 12px; border-radius: 10px; }
.btn.big { font-size: 24px; padding: 14px 30px; min-width: 220px; }
.btn .ic { width: 18px; height: 18px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--panel-brd); background: var(--panel); color: var(--cream); font: 900 22px var(--font-body); display: grid; place-items: center; box-shadow: var(--shadow); }
.icon-btn .ic { width: 24px; height: 24px; }

/* ---------- title ---------- */
.title { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(10,25,12,.15), rgba(5,12,6,.8) 75%); transition: opacity .8s; }
.title.fade { opacity: 0; pointer-events: none; }
.title-inner { text-align: center; padding: 24px; max-width: 760px; animation: titleIn 1.1s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes titleIn { from { opacity: 0; transform: translateY(30px) scale(.94); } }
.logo { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
.logo-emblem { width: 150px; height: 150px; filter: drop-shadow(0 10px 22px rgba(0,0,0,.6)); animation: emblem 6s ease-in-out infinite; }
@keyframes emblem { 50% { transform: rotate(-4deg) scale(1.03); } }
.logo h1 { margin: 0; line-height: .92; font-family: var(--font-head); font-weight: 400; text-align: left; }
.logo .l1 { display: block; font-size: clamp(48px, 9vw, 92px); background: linear-gradient(#fff3b8 0%, #ffc43d 40%, #e07a0c 70%, #9a4204 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #3a1a02; filter: drop-shadow(0 5px 0 #3a1a02) drop-shadow(0 12px 18px rgba(0,0,0,.6)); letter-spacing: 1px; }
.logo .l2 { display: block; font-size: clamp(22px, 4.2vw, 40px); color: #d9f5b0; letter-spacing: 9px; text-shadow: 0 3px 0 #16300c, 0 8px 14px rgba(0,0,0,.6); margin-top: 6px; }
.tagline { font-weight: 800; font-size: 17px; color: #f6e7c0; text-shadow: 0 2px 6px #000; margin: 20px 0 26px; letter-spacing: .4px; }
.title-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.fineprint { font-size: 12px; opacity: .7; margin-top: 26px; text-shadow: 0 1px 3px #000; }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.hud > * { pointer-events: auto; }
.topbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(8px + var(--safe-t)) 10px 8px; display: flex; align-items: center; gap: 10px; pointer-events: none; background: linear-gradient(rgba(5,12,6,.55), rgba(5,12,6,0)); }
.topbar > * { pointer-events: auto; }
.lvl { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--panel-brd); border-radius: 30px; padding: 3px 14px 3px 3px; color: var(--cream); position: relative; box-shadow: var(--shadow); }
.lvl-ring { width: 44px; height: 44px; transform: rotate(-90deg); }
.ring-bg { fill: #2a1a08; stroke: #4a3312; stroke-width: 4; }
.ring-fg { fill: none; stroke: #8fd3ff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 119.4; stroke-dashoffset: 119.4; transition: stroke-dashoffset .6s; }
.lvl > b { position: absolute; left: 3px; top: 3px; width: 44px; height: 44px; display: grid; place-items: center; font: 400 20px var(--font-head); color: #fff; text-shadow: 0 2px 0 #000; }
.lvl-meta { display: flex; flex-direction: column; text-align: left; line-height: 1.1; }
.lvl-meta span { font: 400 15px var(--font-head); color: var(--amber-hi); }
.lvl-meta small { font-size: 11px; font-weight: 800; opacity: .85; }
.res-row { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
.res { display: flex; align-items: center; gap: 5px; background: var(--panel); border: 2px solid rgba(201,154,69,.65); border-radius: 20px; padding: 3px 12px 3px 5px; box-shadow: var(--shadow); min-width: 78px; }
.res b { font: 900 15px var(--font-body); font-variant-numeric: tabular-nums; }
.res .ic { width: 24px; height: 24px; }
.res.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.15); } }
.res.lack { animation: lack .45s; border-color: var(--red); }
@keyframes lack { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
.stars { font-size: 11px; color: #ffd23f; letter-spacing: -1px; margin-left: 2px; }
.top-right { display: flex; align-items: center; gap: 8px; }
.clock { font: 800 13px var(--font-body); background: var(--panel); border: 2px solid rgba(201,154,69,.6); border-radius: 14px; padding: 6px 10px; box-shadow: var(--shadow); white-space: nowrap; }

/* missions tracker */
.missions { position: absolute; left: 10px; top: calc(76px + var(--safe-t)); display: flex; flex-direction: column; gap: 8px; width: 250px; pointer-events: none; }
.m-card { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: linear-gradient(135deg, rgba(40,74,49,.95), rgba(18,32,21,.95)); border: 2px solid var(--panel-brd); border-left: 6px solid var(--amber); border-radius: 12px; box-shadow: var(--shadow); cursor: pointer; animation: slideIn .5s cubic-bezier(.2,.9,.3,1.2) both; transition: transform .15s; }
.m-card:hover { transform: translateX(4px); }
.m-card.done { border-left-color: var(--leaf); background: linear-gradient(135deg, rgba(64,120,44,.95), rgba(24,52,20,.95)); animation: slideIn .5s both, glowDone 1.4s infinite; }
@keyframes glowDone { 50% { box-shadow: 0 0 18px rgba(182,226,122,.8); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-40px); } }
.m-card .m-ico { width: 38px; height: 38px; border-radius: 10px; background: #0d1a0f; display: grid; place-items: center; flex: none; border: 1px solid rgba(255,255,255,.12); }
.m-card .m-ico .ic { width: 26px; height: 26px; }
.m-card .m-txt { flex: 1; min-width: 0; }
.m-card .m-title { font: 400 14px var(--font-head); color: var(--amber-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-card .m-goal { font-size: 12px; font-weight: 700; opacity: .92; }
.m-bar { height: 6px; border-radius: 4px; background: #0a120b; margin-top: 4px; overflow: hidden; }
.m-bar i { display: block; height: 100%; background: linear-gradient(90deg, #7dc15a, #d6f38a); border-radius: 4px; transition: width .4s; }

/* toolbar */
.toolbar { position: absolute; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 6px; padding: 7px; background: linear-gradient(#7a4d25, #4e2e14); border: 3px solid #2e1a0a; border-radius: 20px; box-shadow: var(--shadow), inset 0 2px 0 rgba(255,220,160,.35); }
.tool { position: relative; width: 70px; height: 64px; border: 2px solid #2e1a0a; border-radius: 14px; background: linear-gradient(#3a5e32, #1f3a1c); color: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 3px 0 rgba(0,0,0,.4); transition: transform .1s, background .2s; }
.tool .ic { width: 30px; height: 30px; filter: drop-shadow(0 2px 1px rgba(0,0,0,.5)); }
.tool span { font: 400 12px var(--font-head); letter-spacing: .3px; text-shadow: 0 1px 0 #000; }
.tool:hover { transform: translateY(-3px); background: linear-gradient(#4b7a40, #29502a); }
.tool.active { background: linear-gradient(#ffcf5a, #c46d06); color: #3a1d00; }
.tool.active span { text-shadow: none; }
.tool.pulse { animation: toolPulse 1.2s infinite; }
@keyframes toolPulse { 50% { box-shadow: 0 0 0 4px rgba(255,212,121,.9), 0 0 22px rgba(255,212,121,.8); } }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font: 900 12px var(--font-body); font-style: normal; display: grid; place-items: center; border: 2px solid #fff; animation: bump 1s infinite; }

.modebar, .placebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(96px + var(--safe-b)); display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--panel-brd); border-radius: 16px; padding: 8px 12px; box-shadow: var(--shadow); font-weight: 800; }
.round-btn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; font-size: 22px; color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.round-btn.ok { background: linear-gradient(#8fdc5b, #2f7119); }
.round-btn.no { background: linear-gradient(#ff8a6a, #9e2a17); }
.round-btn:disabled { filter: grayscale(1) brightness(.6); }

.zoom { position: absolute; right: 10px; bottom: calc(96px + var(--safe-b)); display: flex; flex-direction: column; gap: 6px; }

/* info panel */
.info { position: absolute; right: 12px; top: calc(76px + var(--safe-t)); width: 320px; max-height: calc(100vh - 190px); overflow: auto; background: linear-gradient(#20382a, #13241a); border: 3px solid var(--panel-brd); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; animation: infoIn .3s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes infoIn { from { opacity: 0; transform: translateX(30px); } }
.info h3 { margin: 0; font: 400 22px var(--font-head); color: var(--amber-hi); text-shadow: 0 2px 0 #000; }
.info .sub { font-size: 12px; font-weight: 800; opacity: .8; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.info .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; color: var(--cream); font-size: 18px; opacity: .7; }
.info .portrait { width: 100%; height: 150px; border-radius: 12px; background: radial-gradient(ellipse at 50% 80%, #4d7a3a, #1c3320 75%); border: 2px solid rgba(0,0,0,.4); display: block; margin-bottom: 8px; }
.rarity { font: 400 11px var(--font-head); padding: 2px 8px; border-radius: 8px; letter-spacing: .5px; color: #2a1a05; }
.rarity.bronze { background: linear-gradient(#f0b88a, #b86f3a); }
.rarity.silver { background: linear-gradient(#ffffff, #aeb8c2); }
.rarity.gold { background: linear-gradient(#fff1a8, #e5a91e); }
.rarity.legend { background: linear-gradient(#ffd1f4, #b35ae0); color: #fff; text-shadow: 0 1px 0 #3a0a4a; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
.stat { background: rgba(0,0,0,.25); border-radius: 10px; padding: 6px 8px; font-size: 12px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.stat b { font-size: 14px; font-weight: 900; color: #fff; }
.stat .ic { width: 18px; height: 18px; }
.lvl-track { margin: 8px 0; }
.lvl-track .row { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 4px; }
.pips { display: flex; gap: 4px; }
.pips i { flex: 1; height: 12px; border-radius: 6px; background: #0a120b; border: 1px solid rgba(255,255,255,.12); }
.pips i.on { background: linear-gradient(#d6f38a, #5ea83a); box-shadow: 0 0 8px rgba(182,226,122,.5); }
.stage-row { display: flex; gap: 4px; margin: 6px 0; }
.stage-row span { flex: 1; text-align: center; font: 400 11px var(--font-head); padding: 3px 0; border-radius: 6px; background: rgba(0,0,0,.3); opacity: .55; }
.stage-row span.on { opacity: 1; background: linear-gradient(#ffcf5a, #c46d06); color: #3a1d00; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.btn-row .btn { flex: 1 1 auto; }
.progress { height: 16px; border-radius: 8px; background: #0a120b; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.15); margin: 6px 0; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, #ffcf5a, #e8911a); transition: width .3s linear; }
.progress span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 900; text-shadow: 0 1px 2px #000; }
.note { font-size: 12px; opacity: .85; line-height: 1.35; margin: 6px 0; }
.order-list { display: grid; gap: 6px; margin-top: 6px; }
.order { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.25); border-radius: 12px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.08); }
.order .o-name { flex: 1; font-weight: 800; font-size: 13px; line-height: 1.2; }
.order .o-name small { display: block; opacity: .8; font-weight: 700; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(3,8,4,.62); display: grid; place-items: center; animation: fadeIn .2s; backdrop-filter: blur(2px); }
@keyframes fadeIn { from { opacity: 0; } }
.modal-card { width: min(980px, 96vw); max-height: 90vh; display: flex; flex-direction: column; background: linear-gradient(#27432f, #13241a 60%); border: 4px solid var(--panel-brd); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.7), inset 0 0 0 2px #3e2512; animation: pop .35s cubic-bezier(.2,.9,.3,1.25); overflow: hidden; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.modal-head { display: flex; align-items: center; padding: 10px 16px; background: linear-gradient(#8a5a2c, #5c3717); border-bottom: 3px solid #2e1a0a; }
.modal-head h2 { flex: 1; margin: 0; font: 400 28px var(--font-head); color: var(--amber-hi); text-shadow: 0 3px 0 #2e1a0a; letter-spacing: .5px; }
.close { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; background: linear-gradient(#ff8a6a, #9e2a17); color: #fff; font-size: 18px; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.modal-tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: rgba(0,0,0,.2); flex-wrap: wrap; }
.modal-tabs:empty { display: none; }
.tab { border: 2px solid #2e1a0a; border-bottom: 0; background: linear-gradient(#4b3218, #2e1d0c); color: var(--cream); font: 400 16px var(--font-head); padding: 8px 18px; border-radius: 12px 12px 0 0; opacity: .8; }
.tab.on { background: linear-gradient(#ffcf5a, #c46d06); color: #3a1d00; opacity: 1; }
.modal-body { padding: 14px; overflow: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.card { position: relative; background: linear-gradient(#f7ecd2, #e2cfa4); color: var(--ink); border-radius: 16px; border: 3px solid #6b4424; padding: 8px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 5px 0 #3e2512; transition: transform .12s; }
.card:hover { transform: translateY(-4px); }
.card .thumb { height: 110px; border-radius: 10px; background: radial-gradient(ellipse at 50% 85%, #7fb35a, #2d5530 80%); display: grid; place-items: center; overflow: hidden; border: 2px solid rgba(0,0,0,.25); }
.card .thumb canvas, .card .thumb img { max-width: 100%; max-height: 100%; }
.card h4 { margin: 2px 0 0; font: 400 17px var(--font-head); color: #3a2208; }
.card .meta { font-size: 11px; font-weight: 800; color: #6b4a22; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .desc { font-size: 11.5px; font-weight: 700; color: #5a4020; line-height: 1.3; flex: 1; }
.card .btn { width: 100%; font-size: 15px; padding: 7px; }
.card.locked { filter: grayscale(.6); }
.card.locked .thumb { filter: brightness(.35) sepia(.4); }
.card .lockmsg { position: absolute; top: 44px; left: 0; right: 0; text-align: center; font: 400 14px var(--font-head); color: #fff; text-shadow: 0 2px 4px #000; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.card .lockmsg .ic { width: 34px; height: 34px; }
.card .owned { position: absolute; top: 12px; right: 12px; background: #1d3624; color: #fff; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 8px; }
.list { display: grid; gap: 10px; }
.row-card { display: flex; gap: 12px; align-items: center; padding: 10px; background: rgba(0,0,0,.25); border: 2px solid rgba(201,154,69,.35); border-radius: 14px; }
.row-card .rc-thumb { width: 96px; height: 70px; border-radius: 10px; background: radial-gradient(ellipse at 50% 85%, #7fb35a, #2d5530 80%); flex: none; display: grid; place-items: center; overflow: hidden; }
.row-card .rc-main { flex: 1; min-width: 0; }
.row-card h4 { margin: 0 0 2px; font: 400 18px var(--font-head); color: var(--amber-hi); }
.row-card p { margin: 0; font-size: 12.5px; font-weight: 700; opacity: .9; }
.row-card.done { border-color: rgba(125,193,90,.6); }
.section-title { font: 400 18px var(--font-head); color: var(--amber-hi); margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
.section-title:first-child { margin-top: 0; }
.empty { text-align: center; padding: 30px; opacity: .75; font-weight: 800; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.1); font-weight: 800; }
.settings-row input[type=range] { width: 180px; accent-color: var(--amber); }
.toggle { width: 54px; height: 30px; border-radius: 15px; border: 2px solid #2e1a0a; background: #3a2a18; position: relative; }
.toggle::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #d8c8a8; transition: left .2s; }
.toggle.on { background: #4c9e2f; }
.toggle.on::after { left: 27px; background: #fff; }
.league-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.league { border-radius: 14px; padding: 10px; text-align: center; border: 3px solid rgba(0,0,0,.35); color: #2a1a05; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.league h4 { margin: 0; font: 400 20px var(--font-head); }
.league p { margin: 4px 0; font-size: 12px; font-weight: 800; }
.league.bronze { background: linear-gradient(#f0c09a, #b86f3a); }
.league.silver { background: linear-gradient(#ffffff, #9aa6b2); }
.league.gold { background: linear-gradient(#fff1a8, #d99a12); }
.league.platinum { background: linear-gradient(#e8fbff, #6fc3d8); }
.league.allstar { background: linear-gradient(#ffd1f4, #9a4ad0); color: #fff; }
.league.locked { filter: grayscale(1) brightness(.55); }
.team-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.team-pick .pick { border-radius: 12px; border: 3px solid transparent; background: rgba(0,0,0,.3); padding: 6px; text-align: center; font-weight: 800; font-size: 12px; color: var(--cream); }
.team-pick .pick.on { border-color: var(--amber); background: rgba(245,166,35,.2); }
.team-pick .pick canvas { width: 100%; height: 70px; }
.pedia-weak { display: inline-flex; gap: 4px; align-items: center; font-weight: 900; }

/* ---------- advisor ---------- */
.advisor { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%); z-index: 25; display: flex; align-items: flex-end; gap: 0; width: min(720px, 96vw); animation: advIn .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes advIn { from { opacity: 0; transform: translate(-50%, 40px); } }
.adv-portrait { width: 150px; height: 170px; flex: none; margin-right: -16px; z-index: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.adv-portrait svg { width: 100%; height: 100%; }
.adv-box { flex: 1; background: linear-gradient(#fbf1d8, #e8d4a8); color: var(--ink); border: 4px solid #6b4424; border-radius: 18px; padding: 12px 16px 12px 28px; box-shadow: var(--shadow); position: relative; }
.adv-name { font: 400 18px var(--font-head); color: #8a3f06; }
.adv-text { font-size: 15px; font-weight: 700; line-height: 1.4; margin: 4px 0 10px; min-height: 42px; }
.adv-box .btn { float: right; }

/* ---------- toasts & fly ---------- */
.toasts { position: fixed; top: calc(80px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--panel); border: 2px solid var(--panel-brd); border-radius: 14px; padding: 8px 16px; font-weight: 800; box-shadow: var(--shadow); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.3) both; display: flex; gap: 8px; align-items: center; }
.toast.err { border-color: var(--red); }
.toast.good { border-color: var(--leaf); }
.toast.big { font: 400 22px var(--font-head); color: var(--amber-hi); padding: 12px 24px; }
.toast.out { animation: toastOut .4s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(.9); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-12px); } }
.fly-layer { position: fixed; inset: 0; pointer-events: none; z-index: 45; }
.fly { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; }

/* level-up banner */
.levelup { position: fixed; inset: 0; z-index: 42; display: grid; place-items: center; pointer-events: none; }
.levelup .lu-box { text-align: center; animation: luIn 2.8s cubic-bezier(.2,.9,.3,1.2) forwards; }
.levelup h2 { margin: 0; font: 400 72px var(--font-head); background: linear-gradient(#fff3b8, #ffc43d 45%, #d06a08); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #3a1a02; filter: drop-shadow(0 6px 0 #3a1a02); }
.levelup p { font: 400 26px var(--font-head); color: #fff; text-shadow: 0 3px 6px #000; margin: 0; }
@keyframes luIn { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.1); } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

/* ---------- battle ---------- */
.battle { position: fixed; inset: 0; z-index: 35; background: #000; }
#battleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.b-top { position: absolute; top: calc(10px + var(--safe-t)); left: 12px; right: 12px; display: flex; align-items: flex-start; gap: 12px; }
.b-side { flex: 1; background: rgba(10,16,10,.75); border: 2px solid var(--panel-brd); border-radius: 14px; padding: 8px 12px; }
.b-side.foe { text-align: right; }
.b-name { font: 400 20px var(--font-head); color: var(--amber-hi); text-shadow: 0 2px 0 #000; }
.b-hp { position: relative; height: 18px; border-radius: 9px; background: #300; border: 2px solid #000; overflow: hidden; margin: 5px 0; }
.b-hp i { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(#b6f59a, #3a9a2a); transition: width .5s cubic-bezier(.3,.8,.3,1); }
.foe .b-hp i { left: auto; right: 0; }
.b-hp i.mid { background: linear-gradient(#ffe38a, #d69a12); }
.b-hp i.low { background: linear-gradient(#ff9a8a, #c02a1a); }
.b-hp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 900; text-shadow: 0 1px 2px #000; }
.b-team { display: flex; gap: 4px; }
.foe .b-team { justify-content: flex-end; }
.b-team i { width: 14px; height: 14px; border-radius: 50%; background: #7dc15a; border: 2px solid #000; }
.b-team i.ko { background: #500; }
.b-team i.act { box-shadow: 0 0 0 2px #ffd479; }
.b-round { font: 400 26px var(--font-head); color: #fff; text-shadow: 0 3px 0 #000, 0 0 16px rgba(255,160,40,.8); padding-top: 12px; white-space: nowrap; }
.b-msg { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); font: 400 34px var(--font-head); color: #fff; text-shadow: 0 4px 0 #000, 0 0 20px rgba(0,0,0,.8); text-align: center; pointer-events: none; white-space: nowrap; }
.b-msg.show { animation: bmsg 1.4s ease-out forwards; }
@keyframes bmsg { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
.b-actions { position: absolute; bottom: calc(26px + var(--safe-b)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(760px, 96vw); }
.b-act { width: 110px; height: 76px; border-radius: 16px; border: 3px solid #1a0f05; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 400 16px var(--font-head); text-shadow: 0 2px 0 #000; box-shadow: 0 5px 0 #000, inset 0 2px 0 rgba(255,255,255,.3); position: relative; transition: transform .08s; }
.b-act .ic { width: 32px; height: 32px; }
.b-act:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.b-act:disabled { filter: grayscale(1) brightness(.5); cursor: not-allowed; }
.b-act.charge { background: linear-gradient(#e2b42a, #8a6208); }
.b-act.bite { background: linear-gradient(#e06a4a, #8a2a14); }
.b-act.swipe { background: linear-gradient(#c05ad8, #5a1e72); }
.b-act.block { background: linear-gradient(#4aa8e0, #1d4f70); }
.b-act.special { background: linear-gradient(#ffcf5a, #d0580a); }
.b-act.swap { background: linear-gradient(#6aa84a, #2a5a1c); }
.b-act.hint::after { content: 'WEAK!'; position: absolute; top: -10px; right: -8px; background: #fff; color: #c02a1a; font: 400 11px var(--font-head); padding: 2px 6px; border-radius: 8px; text-shadow: none; border: 2px solid #c02a1a; }
.b-act em { position: absolute; top: 4px; right: 6px; font-style: normal; font-size: 11px; }
.b-timer { position: absolute; bottom: calc(8px + var(--safe-b)); left: 50%; transform: translateX(-50%); width: min(600px, 80vw); height: 8px; background: rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; }
.b-timer i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a3a, #ffd479); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .missions { width: 200px; }
  .res { min-width: 0; padding-right: 8px; }
  .res b { font-size: 13px; }
  .clock { display: none; }
  .info { width: calc(100vw - 24px); top: auto; bottom: calc(92px + var(--safe-b)); max-height: 46vh; }
}
@media (max-width: 640px) {
  .lvl-meta { display: none; }
  .lvl { padding-right: 3px; }
  .res .ic { width: 18px; height: 18px; }
  .res { padding: 2px 7px 2px 3px; }
  .res.visitors { display: none; }
  .tool { width: 50px; height: 54px; }

<script>
'use strict';
/* ==========================================================
   Utilities: math, random, noise, formatting, events, colors
   ========================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2;
const now = () => Date.now();

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function hash2(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s = 0, oct = 4) {
  let amp = 0.5, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f, y * f, s + i * 17); norm += amp; amp *= 0.5; f *= 2.03; }
  return sum / norm;
}

/* ---------- number & time formatting ---------- */
function fmt(n) {
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString('en-US');
  if (n < 1e6) return (n / 1000).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
}
function fmtTime(ms) {
  let s = Math.max(0, Math.ceil(ms / 1000));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60); s %= 60;
  if (m < 60) return m + 'm ' + (s ? s + 's' : '');
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

/* ---------- tiny event bus ---------- */
const Bus = {
  map: {},
  on(ev, fn) { (this.map[ev] || (this.map[ev] = [])).push(fn); },
  emit(ev, data) { (this.map[ev] || []).forEach(fn => fn(data)); },
};

/* ---------- colors ---------- */
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function shade(hex, amt) { // amt -1..1 : darken / lighten
  const [r, g, b] = hexToRgb(hex);
  if (amt < 0) return rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
}
function mix(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

/* smooth closed/open curve through points (quadratic midpoints) */
function curveThrough(ctx, pts, closed) {
  if (pts.length < 2) return;
  if (!closed) {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    const l = pts[pts.length - 1];
    ctx.lineTo(l[0], l[1]);
  } else {
    const n = pts.length;
    const m0 = [(pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2];
    ctx.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    ctx.closePath();
  }
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

<script>
'use strict';
/* ==========================================================

const Sfx = {
  ctx: null, master: null, sfxGain: null, musicGain: null, ambGain: null,
  noiseBuf: null, started: false,
  vol: 0.8, music: true, ambience: true,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.vol;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(c.destination);
    this.sfxGain = c.createGain(); this.sfxGain.gain.value = 0.9; this.sfxGain.connect(this.master);
    this.musicGain = c.createGain(); this.musicGain.gain.value = this.music ? 0.32 : 0; this.musicGain.connect(this.master);
    this.ambGain = c.createGain(); this.ambGain.gain.value = this.ambience ? 0.5 : 0; this.ambGain.connect(this.master);
    // reverb (simple generated impulse)
    this.verb = c.createConvolver();
    const len = c.sampleRate * 2.2, ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.verb.buffer = ir;
    this.verbGain = c.createGain(); this.verbGain.gain.value = 0.25;
    this.verb.connect(this.verbGain); this.verbGain.connect(this.master);
    const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  setVolume(v) { this.vol = v; if (this.master) this.master.gain.value = v; },
  setMusic(on) { this.music = on; if (this.musicGain) this.musicGain.gain.setTargetAtTime(on ? 0.32 : 0, this.ctx.currentTime, 0.3); },
  setAmbience(on) { this.ambience = on; if (this.ambGain) this.ambGain.gain.setTargetAtTime(on ? 0.5 : 0, this.ctx.currentTime, 0.3); },

<script>
'use strict';
/* ==========================================================
   Game state, economy rules, missions, save / load
   ========================================================== */
const SAVE_KEY = 'dinoIsland.save.v1';
let G = null;           // the live game state

function newGameState() {
  const seed = (Math.random() * 1e9) | 0;
  return {
    v: 1, seed, created: now(), parkName: 'Dino Island',
    coins: 3000, bucks: 20, crops: 120, meat: 40, level: 1, xp: 0,
    objects: [], nextId: 1,
    roads: '', obs: '',            // encoded grids (filled by World)
    clearing: [],                  // [{i, start, end}]
    amber: {},                     // species -> count
    decoded: { triceratops: true },
    stageResearch: {},             // species -> highest researched stage
    lab: null,                     // {type, species, stage, start, end}
    missions: { next: 0, active: [], progress: {} },
    stats: { cleared: 0, fed: 0, hatched: 0, battlesWon: 0, battles: 0, collected: 0, sinceAmber: 0 },
    league: { best: -1, round: {} },
    pedia: {},                     // species -> {weak:true}
    dayOffset: ((0.375 - (Date.now() / 1000 / 480) % 1) + 1) % 1, // new parks start at 9:00
    tutorialDone: false,
    settings: { vol: 0.8, music: true, ambience: true, daynight: true, quality: 'high' },
    lastTick: now(),
  };
}

/* ---------- definitions helpers ---------- */
function defOf(o) { return o.type === 'paddock' ? SPECIES[o.species] : o.type === 'deco' ? DECOS[o.def] : BUILDINGS[o.def]; }
function coinsEquiv(cost) { return cost.coins || (cost.bucks || 0) * 1500; }
function stageOf(level) { return level >= 30 ? 3 : level >= 20 ? 2 : level >= 10 ? 1 : 0; }
function isAdult(d) { const lv = d.level; const base = [5, 15, 25, 35][d.stage || 0]; return lv >= base; }
function maxLevelForStage(stage) { return stage >= 3 ? MAX_LEVEL : STAGE_LEVELS[stage]; }

function dinoRate(o) { // coins per minute
  if (o.hatchEnd > now()) return 0;
  const sp = SPECIES[o.species];
  return sp.income * (1 + 0.12 * (o.level - 1)) * (1 + 0.5 * (o.stage || 0)) * (1 + (o.bonus || 0) / 100);
}
function dinoCap(o) { return Math.round(dinoRate(o) * STORE_MINUTES); }
function feedCost(o) {
  const sp = SPECIES[o.species];
  return Math.round(8 * RARITY[sp.rarity].food * (1 + 0.45 * (o.level - 1)) * (1 + 0.25 * (o.stage || 0)));
}
function dinoStats(sp, level, stage) {
  const r = RARITY[sp.rarity];
  const lv = 1 + 0.09 * (level - 1), st = 1 + 0.35 * stage;
  return { hp: Math.round(sp.hp * r.hp * lv * st), atk: Math.round(sp.atk * r.atk * lv * st) };
}
function decodeCost(sid) { const sp = SPECIES[sid]; return { coins: Math.round(coinsEquiv(sp.cost) * 0.12 / 10) * 10, time: Math.round(10 + sp.hatch * 0.35) }; }
function evolveCost(sid, stage) { // research cost for stage (1..3)
  const sp = SPECIES[sid];
  return { coins: Math.round(coinsEquiv(sp.cost) * 0.35 * stage / 10) * 10, time: 25 * stage + Math.round(sp.hatch * 0.2 * stage) };
}
function speedCost(msLeft) { return Math.max(1, Math.ceil(msLeft / 60000)); }
function shopIncome(o) { const d = BUILDINGS[o.def]; return Math.round(d.income * (1 + (o.bonus || 0) / 100)); }
function harborOrderCost(o, idx) { const b = BUILDINGS[o.def]; const c = HARBOR_ORDERS[idx].cost; return Math.round(b.food === 'meat' ? c * MEAT_COST_MULT : c); }
function clearTime(kind) {
  const hasRanger = G.objects.some(o => o.def === 'ranger');
  return CLEAR[kind].time * (hasRanger ? 0.75 : 1) * 1000;
}
function clearCost(kind) { return Math.round(CLEAR[kind].cost * (1 + (G.level - 1) * 0.08)); }
function maxWorkers() { return 1 + G.objects.filter(o => o.def === 'ranger').length; }

/* ---------- resources ---------- */
function canAfford(cost) {
  return (G.coins >= (cost.coins || 0)) && (G.bucks >= (cost.bucks || 0)) && (G.crops >= (cost.crops || 0)) && (G.meat >= (cost.meat || 0));
}
function spend(cost) {
  if (!canAfford(cost)) {
    const lack = ['coins', 'bucks', 'crops', 'meat'].find(k => (G[k] || 0) < (cost[k] || 0));
    Bus.emit('lack', lack);
    return false;
  }
  for (const k of ['coins', 'bucks', 'crops', 'meat']) if (cost[k]) G[k] -= cost[k];
  Bus.emit('change');
  return true;
}
function gain(res, amount, from) {
  if (!amount) return;
  G[res] = (G[res] || 0) + amount;
  Bus.emit('gain', { res, amount, from });
  Bus.emit('change');
}
function addXP(n, from) {
  if (!n) return;
  G.xp += n;
  Bus.emit('gain', { res: 'xp', amount: n, from });
  let need = xpForLevel(G.level);
  while (G.xp >= need) {
    G.xp -= need; G.level++;
    const r = levelReward(G.level);
    G.bucks += r.bucks; G.coins += r.coins;
    Bus.emit('levelup', { level: G.level, reward: r });
    need = xpForLevel(G.level);
  }
  Bus.emit('change');
}
function costLabel(cost) {
  if (cost.bucks) return `<i class="ic ic-buck"></i>${fmt(cost.bucks)}`;
  return `<i class="ic ic-coin"></i>${fmt(cost.coins || 0)}`;
}

/* ---------- decoration bonuses & park rating ---------- */
function recomputeBonuses() {
  const decos = G.objects.filter(o => o.type === 'deco');
  for (const o of G.objects) {
    if (o.type === 'deco') continue;
    let b = 0;
    for (const d of decos) {
      const dx = Math.max(o.x - (d.x + d.w - 1), d.x - (o.x + o.w - 1), 0);
      const dy = Math.max(o.y - (d.y + d.h - 1), d.y - (o.y + o.h - 1), 0);
      if (Math.max(dx, dy) <= DECO_RADIUS) b += DECOS[d.def].bonus;
    }
    o.bonus = Math.min(b, 100);
  }
}
function parkScore() {
  const dinos = G.objects.filter(o => o.type === 'paddock');
  const species = new Set(dinos.map(d => d.species)).size;
  const shops = G.objects.filter(o => o.type === 'building' && BUILDINGS[o.def].kind === 'shop').length;
  const decoBonus = G.objects.filter(o => o.type === 'deco').reduce((s, d) => s + DECOS[d.def].bonus, 0);
  const levels = dinos.reduce((s, d) => s + d.level + (d.stage || 0) * 8, 0);
  return species * 18 + dinos.length * 6 + shops * 8 + decoBonus * 1.5 + levels * 0.8;
}
function parkStars() { const s = parkScore(); return s < 40 ? 1 : s < 110 ? 2 : s < 220 ? 3 : s < 400 ? 4 : 5; }
function visitorTarget() {
  const roads = World.roadCount;
  const s = parkScore();
  return Math.min(Math.round(4 + s * 0.28), Math.round(roads * 1.6 + 2), 140);
}

/* ---------- objects ---------- */
function makeObject(type, def, x, y) {
  let w, h;
  if (type === 'paddock') { const s = SPECIES[def].pad; w = h = s; }
  else if (type === 'deco') [w, h] = DECOS[def].size;
  else [w, h] = BUILDINGS[def].size;
  const o = { id: G.nextId++, type, x, y, w, h };
  if (type === 'paddock') {
    const sp = SPECIES[def];
    Object.assign(o, { species: def, level: 1, feeds: 0, stage: 0, coins: 0, hatchEnd: now() + sp.hatch * 1000, hatchStart: now() });
  } else {
    o.def = def;
    const b = type === 'building' ? BUILDINGS[def] : null;
    if (b && (b.kind === 'shop' || b.kind === 'center')) o.start = now();
    if (b && b.kind === 'harbor') o.order = null;
  }
  return o;
}
function addObject(o) { G.objects.push(o); World.rebuildOcc(); recomputeBonuses(); Bus.emit('objects'); }
function removeObject(o) { G.objects = G.objects.filter(x => x !== o); World.rebuildOcc(); recomputeBonuses(); Bus.emit('objects'); }
function objById(id) { return G.objects.find(o => o.id === id); }
function countDef(def) { return G.objects.filter(o => o.def === def).length; }
function ownedSpecies() { return new Set(G.objects.filter(o => o.type === 'paddock').map(o => o.species)); }

/* ---------- missions ---------- */
function missionCheckState(m) {
  const g = m.goal;
  switch (g.type) {
    case 'level': return G.level >= g.level ? 1 : 0;
    case 'dino_level': return G.objects.some(o => o.type === 'paddock' && (!g.species || o.species === g.species) && o.level >= g.level) ? 1 : 0;
    case 'visitors': return Math.min(g.count, Entities.visitors.length);
    case 'species': return Math.min(g.count, ownedSpecies().size);
    case 'league': return G.league.best >= LEAGUES.findIndex(l => l.id === g.league) ? 1 : 0;
    case 'build': return Math.min(g.count, countDef(g.id) > 0 ? Math.max(G.missions.progress[m.id] || 0, 1) : (G.missions.progress[m.id] || 0));
    default: return null;
  }
}
function missionTarget(m) { return ['level', 'dino_level', 'league'].includes(m.goal.type) ? 1 : m.goal.count; }
function missionProgress(m) {
  const st = missionCheckState(m);
  if (st !== null && m.goal.type !== 'build') return st;
  return Math.min(missionTarget(m), G.missions.progress[m.id] || 0);
}
function missionDone(m) { return missionProgress(m) >= missionTarget(m); }
function refillMissions() {
  const ms = G.missions;
  let added = false;
  while (ms.active.length < 3 && ms.next < MISSIONS.length) {
    const m = MISSIONS[ms.next++];
    ms.active.push(m.id);
    if (m.goal.type === 'build' && countDef(m.goal.id) > 0) ms.progress[m.id] = 1;
    Bus.emit('newMission', m);
    added = true;
  }
  if (added) Bus.emit('missions');
}
function missionEvent(type, data = {}) {
  let changed = false;
  for (const id of G.missions.active) {
    const m = MISSIONS.find(x => x.id === id), g = m.goal;
    if (g.type !== type) continue;
    if (g.id && data.id !== g.id) continue;
    if (g.species && data.species !== g.species) continue;
    G.missions.progress[id] = (G.missions.progress[id] || 0) + (data.n || 1);
    changed = true;
  }
  if (changed) Bus.emit('missions');
}
function claimMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  if (!m || !missionDone(m)) return false;
  G.missions.active = G.missions.active.filter(x => x !== id);
  const r = m.reward;
  if (r.coins) gain('coins', r.coins, 'mission');
  if (r.bucks) gain('bucks', r.bucks, 'mission');
  if (r.xp) addXP(r.xp, 'mission');
  Sfx.mission();
  Bus.emit('missionDone', m);
  refillMissions();
  Bus.emit('missions');
  return true;
}

/* ---------- amber & lab ---------- */
function rollAmber(force) {
  // choose a species not yet decoded, near the player's level
  const cands = SPECIES_ORDER.filter(s => !G.decoded[s] && !SPECIES[s].cost.bucks && SPECIES[s].level <= G.level + 3);
  if (!cands.length) return null;
  G.stats.sinceAmber++;
  if (!force && Math.random() > AMBER_CHANCE && G.stats.sinceAmber < 6) return null;
  G.stats.sinceAmber = 0;
  // weight towards lower levels
  cands.sort((a, b) => SPECIES[a].level - SPECIES[b].level);
  const pickIdx = Math.min(cands.length - 1, Math.floor(Math.pow(Math.random(), 1.8) * cands.length));
  const sid = cands[pickIdx];
  G.amber[sid] = (G.amber[sid] || 0) + 1;
  return sid;
}
function amberCount() { return Object.values(G.amber).reduce((a, b) => a + b, 0); }
function startLab(task) {
  if (G.lab) return false;
  G.lab = task;
  Bus.emit('lab');
  return true;
}
function finishLab() {
  const t = G.lab;
  if (!t) return;
  G.lab = null;
  if (t.type === 'decode') {
    G.decoded[t.species] = true;
    missionEvent('decode', { species: t.species });
    Bus.emit('decoded', t.species);
    addXP(40 + SPECIES[t.species].level * 10, 'lab');
  } else {
    G.stageResearch[t.species] = Math.max(G.stageResearch[t.species] || 0, t.stage);
    Bus.emit('researched', t);
    addXP(80 * t.stage, 'lab');
  }
  Bus.emit('lab');
}

/* ---------- save / load ---------- */
function saveGame() {
  if (!G) return;
  try {
    G.roads = World.encodeRoads();
    G.obs = World.encodeObs();
    G.lastTick = now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
  } catch (e) { /* storage may be unavailable */ }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1) return null;
    const base = newGameState();
    for (const k in base) if (s[k] === undefined) s[k] = base[k];
    for (const k in base.stats) if (s.stats[k] === undefined) s.stats[k] = base.stats[k];
    for (const k in base.settings) if (s.settings[k] === undefined) s.settings[k] = base.settings[k];
    return s;
  } catch (e) { return null; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }

<script>
'use strict';
/* ==========================================================
   World: island generation, tiles, obstacles, roads, iso math
   ========================================================== */
const T_DEEP = 0, T_SHALLOW = 1, T_SAND = 2, T_GRASS = 3, T_MOUNT = 4;
const OBS_KIND = [null, 'tree', 'palm', 'bush', 'rock', 'bigrock'];
const TSCALE = 1.5;          // terrain canvas resolution multiplier
const CLIFF = 16;            // island edge cliff height (world px)

const World = {
  tiles: null, obs: null, roads: null, occ: null, shade: null,
  terrain: null, terrainOX: 0, terrainOY: 0,
  roadCount: 0, night: 0, volcano: null, shore: [],
  idx: (x, y) => y * MAP + x,
  inMap: (x, y) => x >= 0 && y >= 0 && x < MAP && y < MAP,

  generate(seed) {
    const N = MAP;
    this.tiles = new Uint8Array(N * N);
    this.obs = new Uint8Array(N * N);
    this.roads = new Uint8Array(N * N);
    this.occ = new Int32Array(N * N);
    this.shade = new Float32Array(N * N);
    const rng = mulberry32(seed);
    const s = seed % 1000;
    const cx = N / 2, cy = N / 2;
    this.volcano = { x: Math.round(N * 0.27), y: Math.round(N * 0.25), r: 4.2 };
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = (x + 0.5 - cx) / (N / 2), dy = (y + 0.5 - cy) / (N / 2);
      let d = Math.sqrt(dx * dx + dy * dy);
      const n = fbm(x * 0.11, y * 0.11, s, 4);
      let v = d + (n - 0.5) * 0.5;
      // extend the island towards the volcano corner
      const vd = Math.hypot(x - this.volcano.x, y - this.volcano.y);
      if (vd < 10) v -= (10 - vd) * 0.02;
      let t;
      if (v < 0.74) t = T_GRASS; else if (v < 0.81) t = T_SAND; else if (v < 0.9) t = T_SHALLOW; else t = T_DEEP;
      if (vd < this.volcano.r) t = T_MOUNT;
      this.tiles[this.idx(x, y)] = t;
      this.shade[this.idx(x, y)] = fbm(x * 0.07, y * 0.07, s + 50, 3);
    }
    // keep the starting area solid land
    for (let y = 15; y < 34; y++) for (let x = 16; x < 33; x++) {
      const i = this.idx(x, y);
      if (this.tiles[i] !== T_MOUNT) this.tiles[i] = T_GRASS;
    }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = this.idx(x, y), t = this.tiles[i];
      if (t !== T_GRASS && t !== T_SAND) continue;
      if (x >= 17 && x <= 31 && y >= 17 && y <= 32) continue; // starting clearing
      const dens = fbm(x * 0.16, y * 0.16, s + 99, 3);
      const r = rng();
      if (t === T_SAND) { if (r < 0.16) this.obs[i] = 2; else if (r < 0.2) this.obs[i] = 4; continue; }
      const nearVol = Math.hypot(x - this.volcano.x, y - this.volcano.y) < this.volcano.r + 2.5;
      if (nearVol) { this.obs[i] = r < 0.35 ? 4 : r < 0.5 ? 5 : r < 0.8 ? 1 : 3; continue; }
      if (dens > 0.44 || r < 0.35) {
        const k = rng();
        this.obs[i] = k < 0.64 ? 1 : k < 0.8 ? 3 : k < 0.92 ? 4 : k < 0.96 ? 2 : 5;
      } else if (r < 0.55) this.obs[i] = 3;
    }
    // a few trees near the clearing edge give the start some framing
    for (const [x, y] of [[17, 25], [18, 18], [31, 20], [30, 31], [17, 31], [19, 32]]) this.obs[this.idx(x, y)] = 1;
    this.findShore();
  },

  findShore() {
    this.shore = [];
    for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
      if (!this.isLandT(this.tiles[this.idx(x, y)])) continue;
      for (const [dx, dy, e] of [[1, 0, 'e'], [0, 1, 's'], [-1, 0, 'w'], [0, -1, 'n']]) {
        const nx = x + dx, ny = y + dy;
        if (!this.inMap(nx, ny) || !this.isLandT(this.tiles[this.idx(nx, ny)])) this.shore.push({ x, y, e });
      }
    }
  },
  isLandT: t => t >= T_SAND,
  isLand(x, y) { return this.inMap(x, y) && this.tiles[this.idx(x, y)] >= T_SAND; },
  buildable(x, y) { if (!this.inMap(x, y)) return false; const t = this.tiles[this.idx(x, y)]; return t === T_GRASS || t === T_SAND; },
  tileFree(x, y, ignoreId = 0) {
    if (!this.buildable(x, y)) return false;
    const i = this.idx(x, y);
    if (this.obs[i]) return false;
    if (this.occ[i] && this.occ[i] !== ignoreId) return false;
    return true;
  },
  canPlace(x, y, w, h, ignoreId = 0, allowRoad = false) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
      if (!this.tileFree(i, j, ignoreId)) return false;
      if (!allowRoad && this.roads[this.idx(i, j)]) return false;
    }
    return true;
  },
  rebuildOcc() {
    this.occ.fill(0);
    for (const o of G.objects) for (let j = o.y; j < o.y + o.h; j++) for (let i = o.x; i < o.x + o.w; i++) if (this.inMap(i, j)) this.occ[this.idx(i, j)] = o.id;
    // gate middle tile is walkable road
    const gate = G.objects.find(o => o.def === 'gate');
    if (gate) this.roads[this.idx(gate.x + 1, gate.y)] = 1;
    this.countRoads();
  },
  countRoads() { let c = 0; for (let i = 0; i < this.roads.length; i++) c += this.roads[i]; this.roadCount = c; },
  objAt(x, y) { if (!this.inMap(x, y)) return null; const id = this.occ[this.idx(x, y)]; return id ? objById(id) : null; },
  isRoad(x, y) { return this.inMap(x, y) && this.roads[this.idx(x, y)] === 1; },

  encodeRoads() { let s = ''; for (let i = 0; i < this.roads.length; i++) s += this.roads[i]; return s; },
  encodeObs() { let s = ''; for (let i = 0; i < this.obs.length; i++) s += this.obs[i]; return s; },
  decode(str, arr) { if (!str || str.length !== arr.length) return false; for (let i = 0; i < arr.length; i++) arr[i] = +str[i] || 0; return true; },

  /* ---------- iso math ---------- */
  toWorld(x, y) { return { x: (x - y) * TW / 2, y: (x + y) * TH / 2 }; },
  fromWorld(wx, wy) { return { x: (wy / (TH / 2) + wx / (TW / 2)) / 2, y: (wy / (TH / 2) - wx / (TW / 2)) / 2 }; },

  /* ---------- static terrain canvas ---------- */
  renderTerrain() {
    const pad = 40;
    const W = MAP * TW + pad * 2, H = MAP * TH + pad * 2 + CLIFF;
    const c = makeCanvas(W * TSCALE, H * TSCALE), ctx = c.getContext('2d');
    ctx.scale(TSCALE, TSCALE);
    this.terrainOX = MAP * TW / 2 + pad; this.terrainOY = pad;
    ctx.translate(this.terrainOX, this.terrainOY);
    const P = (x, y) => [(x - y) * TW / 2, (x + y) * TH / 2];
    const diamond = (x, y, sc = 1, dz = 0) => {
      const cx = (x - y) * TW / 2, cy = (x + y + 1) * TH / 2 + dz;
      ctx.beginPath();
      ctx.moveTo(cx, cy - TH / 2 * sc); ctx.lineTo(cx + TW / 2 * sc, cy); ctx.lineTo(cx, cy + TH / 2 * sc); ctx.lineTo(cx - TW / 2 * sc, cy); ctx.closePath();
    };
    const land = (x, y) => this.isLand(x, y);
    const rnd = (x, y, k) => hash2(x, y, k + this.seedK);
    this.seedK = G.seed % 997;

    // 1. shallow water halo (layered soft diamonds)
    const layers = [[3.4, 'rgba(60,200,210,0.07)'], [2.6, 'rgba(70,210,215,0.09)'], [1.9, 'rgba(90,220,215,0.12)'], [1.4, 'rgba(130,230,210,0.16)']];
    for (const [sc, col] of layers) {
      ctx.fillStyle = col;
      for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) if (land(x, y)) { diamond(x, y, sc, CLIFF * 0.5); ctx.fill(); }
    }
    // 2. wet sand ring / beach foam base
    ctx.fillStyle = '#c9b27a';
    for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) if (land(x, y)) { diamond(x, y, 1.18, CLIFF); ctx.fill(); }
    // 3. cliff faces on front-facing edges
    for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
      if (!land(x, y)) continue;
      const t = this.tiles[this.idx(x, y)];
      const top = t === T_SAND ? ['#d8c088', '#a88a54'] : ['#8a6a40', '#4e3820'];
      const [a0, a1] = P(x, y + 1), [b0, b1] = P(x + 1, y + 1), [c0, c1] = P(x + 1, y);
      if (!land(x, y + 1)) { // south-west face
        const g = ctx.createLinearGradient(0, a1, 0, a1 + CLIFF); g.addColorStop(0, top[0]); g.addColorStop(1, top[1]);
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(a0, a1); ctx.lineTo(b0, b1); ctx.lineTo(b0, b1 + CLIFF); ctx.lineTo(a0, a1 + CLIFF); ctx.closePath(); ctx.fill();
        this.strata(ctx, a0, a1, b0, b1, t);
      }
      if (!land(x + 1, y)) { // south-east face (darker)
        const g = ctx.createLinearGradient(0, c1, 0, c1 + CLIFF); g.addColorStop(0, shade(top[0], -0.18)); g.addColorStop(1, shade(top[1], -0.25));
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(b0, b1); ctx.lineTo(c0, c1); ctx.lineTo(c0, c1 + CLIFF); ctx.lineTo(b0, b1 + CLIFF); ctx.closePath(); ctx.fill();
        this.strata(ctx, b0, b1, c0, c1, t);
      }
    }
    // 4. top surfaces
    for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
      const t = this.tiles[this.idx(x, y)];
      if (t < T_SAND) continue;
      const sh = this.shade[this.idx(x, y)];
      let col;
      if (t === T_SAND) col = mix('#f0dca0', '#dcc080', sh);
      else if (t === T_MOUNT) col = mix('#6a5a48', '#4a3e32', sh);
      else {
        col = mix('#8cc45a', '#5a9a3c', clamp(sh * 1.3 - 0.15, 0, 1));
        // grass near sand turns yellowish
        let nearSand = 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nt = this.inMap(x + dx, y + dy) ? this.tiles[this.idx(x + dx, y + dy)] : 0; if (nt === T_SAND || nt < T_SAND) nearSand++; }
        if (nearSand) col = mix(col, '#b8c86a', 0.35);
      }
      ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1.2;
      diamond(x, y); ctx.fill(); ctx.stroke();
    }

    ctx.save();
    for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
      const t = this.tiles[this.idx(x, y)];
      if (t !== T_GRASS) continue;
      const n = fbm(x * 0.35, y * 0.35, this.seedK + 7, 2);
      if (n > 0.58) { ctx.fillStyle = `rgba(20,60,10,${(n - 0.58) * 0.5})`; diamond(x, y, 1.3); ctx.fill(); }
      else if (n < 0.38) { ctx.fillStyle = `rgba(230,250,150,${(0.38 - n) * 0.35})`; diamond(x, y, 1.3); ctx.fill(); }
    }
    ctx.restore();
    // 6. details: grass blades, flowers, dirt, sand speckles, shells
    for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
      const t = this.tiles[this.idx(x, y)];
      if (t < T_SAND) continue;
      const [tx, ty] = P(x, y);
      const cyy = ty + TH / 2;
      const inTile = (u, v) => [tx + (u - v) * TW / 2, cyy - TH / 2 + (u + v) * TH / 2];
      if (t === T_GRASS) {
        // dirt patch
        if (rnd(x, y, 3) < 0.08) {
          const [px, py] = inTile(0.3 + rnd(x, y, 4) * 0.4, 0.3 + rnd(x, y, 5) * 0.4);
          const g = ctx.createRadialGradient(px, py, 0, px, py, 16);
          g.addColorStop(0, 'rgba(120,90,50,0.45)'); g.addColorStop(1, 'rgba(120,90,50,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(px, py, 18, 9, 0, 0, TAU); ctx.fill();
        }
        for (let k = 0; k < 16; k++) {
          const u = rnd(x, y, 10 + k), v = rnd(x, y, 40 + k);
          const [px, py] = inTile(u, v);
          const hgt = 2.5 + rnd(x, y, 70 + k) * 3.5;
          const dark = rnd(x, y, 90 + k) < 0.55;
          ctx.strokeStyle = dark ? 'rgba(40,90,25,0.55)' : 'rgba(190,235,120,0.5)';
          ctx.lineWidth = 0.9;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(px + 0.5, py - hgt * 0.6, px + (rnd(x, y, 99 + k) - 0.5) * 3, py - hgt); ctx.stroke();
        }
        if (rnd(x, y, 200) < 0.18) {
          const cols = ['#fff6e0', '#ffd23f', '#ff8ab0', '#b08aff', '#ff6a4a'];
          const col = cols[Math.floor(rnd(x, y, 201) * cols.length)];
          for (let k = 0; k < 4; k++) {
            const [px, py] = inTile(rnd(x, y, 210 + k), rnd(x, y, 220 + k));
            ctx.fillStyle = 'rgba(30,70,20,0.6)'; ctx.fillRect(px - 0.4, py - 3, 0.8, 3);
            ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py - 3, 1.3, 0, TAU); ctx.fill();
          }
        }
      } else if (t === T_SAND) {
        for (let k = 0; k < 14; k++) {
          const [px, py] = inTile(rnd(x, y, 300 + k), rnd(x, y, 330 + k));
          ctx.fillStyle = rnd(x, y, 360 + k) < 0.5 ? 'rgba(160,120,60,0.35)' : 'rgba(255,250,230,0.6)';
          ctx.fillRect(px, py, 1.2, 1.2);
        }
        if (rnd(x, y, 400) < 0.07) {
          const [px, py] = inTile(0.5, 0.5);
          ctx.fillStyle = '#fbe9dc'; ctx.strokeStyle = '#b88a6a'; ctx.lineWidth = 0.6;
          ctx.beginPath(); ctx.ellipse(px, py, 2.6, 1.8, 0.3, 0, TAU); ctx.fill(); ctx.stroke();
        }
      } else if (t === T_MOUNT) {
        for (let k = 0; k < 10; k++) {
          const [px, py] = inTile(rnd(x, y, 500 + k), rnd(x, y, 530 + k));
          ctx.fillStyle = rnd(x, y, 560 + k) < 0.5 ? 'rgba(30,20,15,0.4)' : 'rgba(160,140,120,0.35)';
          ctx.beginPath(); ctx.ellipse(px, py, 2 + rnd(x, y, 590 + k) * 3, 1.2 + rnd(x, y, 600 + k) * 1.5, 0, 0, TAU); ctx.fill();
        }
      }
    }
    // 7. grass tufts spilling onto sand borders
    for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
      if (this.tiles[this.idx(x, y)] !== T_SAND) continue;
      let g = 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (this.inMap(x + dx, y + dy) && this.tiles[this.idx(x + dx, y + dy)] === T_GRASS) g++;
      if (!g) continue;
      const [tx, ty] = P(x, y);
      for (let k = 0; k < 7; k++) {
        const u = rnd(x, y, 700 + k), v = rnd(x, y, 720 + k);
        const px = tx + (u - v) * TW / 2, py = ty + (u + v) * TH / 2;
        ctx.fillStyle = `rgba(110,160,60,${0.35 + rnd(x, y, 740 + k) * 0.3})`;
        ctx.beginPath(); ctx.ellipse(px, py, 3 + u * 3, 1.6 + v, 0, 0, TAU); ctx.fill();
      }
    }
    this.terrain = c;
  },
  strata(ctx, x0, y0, x1, y1, t) {
    ctx.save();
    ctx.strokeStyle = t === T_SAND ? 'rgba(120,90,40,0.25)' : 'rgba(30,20,10,0.3)';
    ctx.lineWidth = 0.8;
    for (let k = 1; k <= 3; k++) {
      const dz = k * CLIFF / 4 + Math.sin(x0 * 0.3 + k) * 1.2;
      ctx.beginPath(); ctx.moveTo(x0, y0 + dz); ctx.lineTo(x1, y1 + dz); ctx.stroke();
    }
    // grass overhang lip
    if (t === T_GRASS) {
      ctx.strokeStyle = '#5a9a3c'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x0, y0 + 1); ctx.lineTo(x1, y1 + 1); ctx.stroke();
    }
    ctx.restore();
  },
};

'use strict';
/* ==========================================================
   Sprites: procedurally painted trees, rocks, volcano,
   buildings and decorations (pre-rendered at 2x)
   ========================================================== */
const SPR = 2;
const Sprites = { trees: {}, rocks: {}, buildings: {}, decos: {}, fences: {}, misc: {}, icons: {} };

function makeSprite(w, h, ax, ay, draw) {
  const c = makeCanvas(w * SPR, h * SPR), ctx = c.getContext('2d');
  ctx.scale(SPR, SPR); ctx.translate(ax, ay);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const extra = draw(ctx) || {};
  return Object.assign({ c, ax, ay, w, h }, extra);
}
function drawSprite(ctx, s, x, y, scale = 1, alpha = 1) {
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(s.c, x - s.ax * scale, y - s.ay * scale, s.w * scale, s.h * scale);
  if (alpha !== 1) ctx.globalAlpha = 1;
}

/* ---------- foliage helpers ---------- */
function lumpyCircle(ctx, x, y, r, rng, lumps = 9, amp = 0.12) {
  const ph = rng() * TAU;
  ctx.beginPath();
  const n = 28;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    const rr = r * (1 + amp * Math.sin(a * lumps + ph) + amp * 0.5 * Math.sin(a * (lumps + 4) + ph * 2));
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.92;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function leafBlob(ctx, x, y, r, pal, rng, dim = 0) {
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.05, x, y, r * 1.1);
  g.addColorStop(0, shade(pal.light, -dim)); g.addColorStop(0.5, shade(pal.base, -dim)); g.addColorStop(1, shade(pal.dark, -dim));
  ctx.fillStyle = g;
  lumpyCircle(ctx, x, y, r, rng);
  ctx.fill();
  // leaf texture: tiny highlight crescents on the lit side, dark notches on the shadow side
  ctx.save();
  lumpyCircle(ctx, x, y, r, rng); ctx.clip();
  for (let i = 0; i < r * 1.4; i++) {
    const a = rng() * TAU, d = Math.sqrt(rng()) * r;
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    const lit = (px - x) + (py - y) < 0;
    ctx.strokeStyle = lit ? rgba(pal.light, 0.55) : rgba(pal.dark, 0.5);
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(px, py, 1.8 + rng() * 2.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }
  ctx.restore();
}
function groundShadow(ctx, x, y, rx, ry, a = 0.3) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
  g.addColorStop(0, `rgba(10,30,5,${a})`); g.addColorStop(1, 'rgba(10,30,5,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill();
}
function trunkPath(ctx, x0, y0, x1, y1, w0, w1, bend) {
  const mx = (x0 + x1) / 2 + bend, my = (y0 + y1) / 2;
  ctx.beginPath();
  ctx.moveTo(x0 - w0, y0);
  ctx.quadraticCurveTo(mx - (w0 + w1) / 2, my, x1 - w1, y1);
  ctx.lineTo(x1 + w1, y1);
  ctx.quadraticCurveTo(mx + (w0 + w1) / 2, my, x0 + w0, y0);
  ctx.closePath();
}
function barkFill(ctx, x, yTop, yBot, w, light, dark) {
  const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
  g.addColorStop(0, light); g.addColorStop(0.45, mix(light, dark, 0.35)); g.addColorStop(1, dark);
  return g;
}

const FOLIAGE = [
  { base: '#3f8a34', light: '#9ad86a', dark: '#1a4418' },
  { base: '#4c9438', light: '#b4e27a', dark: '#1e4a1a' },
  { base: '#2f7a44', light: '#86d09a', dark: '#123a22' },
  { base: '#5a8a2a', light: '#c6de6a', dark: '#2a4410' },
  { base: '#347034', light: '#7cc06a', dark: '#153015' },
];

/* ---------- tree painters ---------- */
function paintBroadleaf(ctx, rng, v) {
  const pal = FOLIAGE[v % FOLIAGE.length];
  const H = 58 + rng() * 22, R = 24 + rng() * 8;
  groundShadow(ctx, 10, 2, R * 1.3, R * 0.55, 0.35);
  // buttress roots
  ctx.fillStyle = '#4a321c';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i * 2, -12); ctx.quadraticCurveTo(i * 5, -2, i * 8 + (i > 0 ? 3 : -3), 2); ctx.lineTo(i * 3, 1); ctx.closePath(); ctx.fill();
  }
  const bend = (rng() - 0.5) * 12;
  trunkPath(ctx, 0, 1, bend * 0.6, -H + R * 0.4, 5, 2.5, bend);
  ctx.fillStyle = barkFill(ctx, 0, -H, 0, 5, '#8a6a44', '#3a2614'); ctx.fill();
  ctx.strokeStyle = 'rgba(30,18,8,0.45)'; ctx.lineWidth = 0.7;
  for (let i = 0; i < 6; i++) { const y = -4 - i * (H - R) / 6; ctx.beginPath(); ctx.moveTo(-3, y); ctx.quadraticCurveTo(0, y - 3, 3, y - 1); ctx.stroke(); }
  // branches
  ctx.strokeStyle = '#4a321c'; ctx.lineWidth = 2.2;
  for (let i = 0; i < 3; i++) { const sx = bend * 0.4, sy = -H * 0.55 - i * 6; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + (i - 1) * 10, sy - 10, sx + (i - 1) * 18, sy - 18); ctx.stroke(); }
  // canopy
  const cx = bend * 0.6, cy = -H;
  const blobs = [];
  for (let i = 0; i < 15; i++) {
    const a = rng() * TAU, d = Math.sqrt(rng()) * R * 0.85;
    blobs.push([cx + Math.cos(a) * d * 1.15, cy + Math.sin(a) * d * 0.7, R * (0.38 + rng() * 0.22)]);
  }
  blobs.push([cx, cy + R * 0.15, R * 0.6]);
  blobs.sort((a, b) => a[1] - b[1]);
  // dark underside mass
  ctx.fillStyle = pal.dark; lumpyCircle(ctx, cx, cy + R * 0.2, R * 0.95, rng, 7, 0.1); ctx.fill();
  blobs.forEach(([x, y, r], i) => leafBlob(ctx, x, y, r, pal, rng, (y - cy) / R * 0.18));
  // occasional flowering tree
  if (v % 7 === 3) for (let i = 0; i < 18; i++) {
    const a = rng() * TAU, d = Math.sqrt(rng()) * R;
    ctx.fillStyle = rng() < 0.5 ? '#ff6a8a' : '#ffb03a';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.7 - 3, 1.6, 0, TAU); ctx.fill();
  }
  return { hitR: R, hitH: H + R };
}
function paintAraucaria(ctx, rng, v) {
  const H = 96 + rng() * 26;
  groundShadow(ctx, 12, 2, 26, 11, 0.33);
  trunkPath(ctx, 0, 1, 0, -H, 4, 1.5, (rng() - 0.5) * 4);
  ctx.fillStyle = barkFill(ctx, 0, -H, 0, 4, '#7a5a3a', '#2e1e10'); ctx.fill();
  const pal = { base: '#2a6a3a', light: '#6aaa6a', dark: '#0e2e18' };
  const tiers = 6;
  for (let t = 0; t < tiers; t++) {
    const k = t / (tiers - 1);
    const y = -H * 0.42 - k * H * 0.58;
    const w = lerp(26, 8, k) * (0.85 + rng() * 0.3);
    // drooping umbrella of branch clusters
    for (let side = -1; side <= 1; side += 2) {
      ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.quadraticCurveTo(side * w * 0.6, y - 4, side * w, y + 3); ctx.stroke();
    }
    const n = Math.round(4 + w / 5);
    for (let i = 0; i < n; i++) {
      const u = (i / (n - 1)) * 2 - 1;
      const px = u * w, py = y - 3 + Math.abs(u) * 5 - (1 - Math.abs(u)) * 3;
      const r = 5 + (1 - Math.abs(u)) * 3;
      const g = ctx.createRadialGradient(px - 2, py - 3, 0.5, px, py, r * 1.3);
      g.addColorStop(0, pal.light); g.addColorStop(0.6, pal.base); g.addColorStop(1, pal.dark);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(px, py, r * 1.35, r * 0.75, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba('#9ad08a', 0.35); ctx.lineWidth = 0.7;
      for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.moveTo(px - r + j * r * 0.6, py - 1); ctx.lineTo(px - r + j * r * 0.6 + 2, py + 2.5); ctx.stroke(); }
    }
  }
  // crown tuft
  leafBlob(ctx, 0, -H - 2, 6, pal, rng);
  return { hitR: 22, hitH: H + 8 };
}
function paintTreeFern(ctx, rng, v) {
  const H = 42 + rng() * 16;
  groundShadow(ctx, 8, 2, 24, 10, 0.3);
  const bend = (rng() - 0.5) * 8;
  trunkPath(ctx, 0, 1, bend, -H, 3.5, 3, bend * 0.5);
  ctx.fillStyle = barkFill(ctx, 0, -H, 0, 4, '#6a4a2a', '#2a1a0c'); ctx.fill();
  ctx.fillStyle = 'rgba(20,10,4,0.5)';
  for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.arc(bend * (i / 14) + (rng() - 0.5) * 4, -i * H / 14, 1.2, 0, TAU); ctx.fill(); }
  const tx = bend, ty = -H;
  const fronds = [];
  for (let i = 0; i < 11; i++) {
    const a = -Math.PI / 2 + (i / 10 - 0.5) * Math.PI * 1.25 + (rng() - 0.5) * 0.2;
    fronds.push({ a, len: 26 + rng() * 10, back: Math.abs(Math.cos(a)) < 0.5 && i % 2 === 0 });
  }
  fronds.sort((a, b) => (b.back ? 1 : 0) - (a.back ? 1 : 0));
  for (const f of fronds) {
    const ex = tx + Math.cos(f.a) * f.len * 1.1, ey = ty + Math.sin(f.a) * f.len * 0.45 + f.len * 0.55;
    const mx = tx + Math.cos(f.a) * f.len * 0.6, my = ty + Math.sin(f.a) * f.len * 0.55 - 6;
    const col = f.back ? '#2e6a26' : '#4e9a34';
    ctx.strokeStyle = shade(col, -0.3); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
    // leaflets
    for (let s = 0.12; s <= 1; s += 0.075) {
      const bx = (1 - s) * (1 - s) * tx + 2 * (1 - s) * s * mx + s * s * ex;
      const by = (1 - s) * (1 - s) * ty + 2 * (1 - s) * s * my + s * s * ey;
      const dx = 2 * (1 - s) * (mx - tx) + 2 * s * (ex - mx), dy = 2 * (1 - s) * (my - ty) + 2 * s * (ey - my);
      const l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
      const ll = 7 * (1 - s * 0.7);
      ctx.strokeStyle = s < 0.5 ? col : shade(col, 0.15); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + nx * ll + dx / l * 2, by + ny * ll + dy / l * 2 + 1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - nx * ll + dx / l * 2, by - ny * ll + dy / l * 2 + 1.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#6a8a3a'; ctx.beginPath(); ctx.arc(tx, ty, 3.5, 0, TAU); ctx.fill();
  return { hitR: 22, hitH: H + 18 };
}
function paintPalm(ctx, rng, v, scale = 1) {
  ctx.save(); ctx.scale(scale, scale);
  const H = 62 + rng() * 22, lean = (rng() < 0.5 ? -1 : 1) * (8 + rng() * 14);
  groundShadow(ctx, lean * 0.5 + 10, 2, 24, 10, 0.3);
  const top = [lean, -H];
  // ringed trunk
  const segs = 16;
  for (let i = 0; i < segs; i++) {
    const t0 = i / segs, t1 = (i + 1) / segs;
    const p = t => [lean * t * t, -H * t];
    const [x0, y0] = p(t0), [x1, y1] = p(t1);
    const w = lerp(4.2, 2.6, t0);
    const g = ctx.createLinearGradient(x0 - w, 0, x0 + w, 0);
    g.addColorStop(0, '#b89a6a'); g.addColorStop(0.5, '#8a6a44'); g.addColorStop(1, '#4e3a22');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x0 - w, y0); ctx.lineTo(x1 - w * 0.95, y1 + 0.5); ctx.lineTo(x1 + w * 0.95, y1 + 0.5); ctx.lineTo(x0 + w, y0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(50,34,16,0.6)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(x1 - w, y1 + 0.5); ctx.quadraticCurveTo(x1, y1 + 2, x1 + w, y1 + 0.5); ctx.stroke();
  }
  // fronds
  const fr = [];
  for (let i = 0; i < 9; i++) fr.push({ a: (i / 9) * TAU + rng() * 0.3, len: 28 + rng() * 10 });
  fr.sort((a, b) => Math.sin(a.a) - Math.sin(b.a));
  for (const f of fr) {
    const dx = Math.cos(f.a), dz = Math.sin(f.a);
    const ex = top[0] + dx * f.len, ey = top[1] + dz * f.len * 0.45 + f.len * 0.42;
    const mx = top[0] + dx * f.len * 0.55, my = top[1] + dz * f.len * 0.3 - 10;
    const back = dz < -0.2;
    const col = back ? '#3a7a2a' : '#5aa83a';
    for (let s = 0.08; s <= 1; s += 0.05) {
      const bx = (1 - s) * (1 - s) * top[0] + 2 * (1 - s) * s * mx + s * s * ex;
      const by = (1 - s) * (1 - s) * top[1] + 2 * (1 - s) * s * my + s * s * ey;
      const tx = 2 * (1 - s) * (mx - top[0]) + 2 * s * (ex - mx), ty = 2 * (1 - s) * (my - top[1]) + 2 * s * (ey - my);
      const l = Math.hypot(tx, ty) || 1, nx = -ty / l, ny = tx / l;
      const ll = 10 * Math.sin(s * Math.PI) + 2;
      ctx.strokeStyle = s < 0.4 ? shade(col, -0.1) : col; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + nx * ll + tx / l * 3, by + ny * ll + 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - nx * ll + tx / l * 3, by - ny * ll + 5); ctx.stroke();
    }
    ctx.strokeStyle = shade(col, -0.35); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
  }
  // coconuts
  for (let i = 0; i < 3; i++) {
    const g = ctx.createRadialGradient(top[0] - 2 + i * 2.5, top[1] + 3, 0.5, top[0] - 1 + i * 2.5, top[1] + 4, 3.5);
    g.addColorStop(0, '#9a7a3a'); g.addColorStop(1, '#3a2a10');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(top[0] - 2.5 + i * 2.5, top[1] + 4 + (i % 2), 2.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
  return { hitR: 20 * scale, hitH: (H + 20) * scale };
}
function paintBush(ctx, rng, v) {
  const pal = FOLIAGE[(v + 2) % FOLIAGE.length];
  groundShadow(ctx, 5, 2, 18, 8, 0.3);
  if (v % 4 === 3) { // cycad
    ctx.fillStyle = '#6a4a2a';
    ctx.beginPath(); ctx.ellipse(0, -6, 6, 9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(30,20,8,0.6)'; ctx.lineWidth = 0.8;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-5, -10 + i * 3); ctx.lineTo(5, -12 + i * 3); ctx.stroke(); }
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI + (i / 9) * Math.PI, len = 18 + rng() * 6;
      const ex = Math.cos(a) * len, ey = -14 + Math.sin(a) * len * 0.6;
      ctx.strokeStyle = i % 2 ? '#3a7a2a' : '#5a9a34'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.quadraticCurveTo(ex * 0.5, -22, ex, ey); ctx.stroke();
      for (let s = 0.2; s < 1; s += 0.12) {
        const bx = ex * s, by = -14 + (ey + 14) * s - Math.sin(s * Math.PI) * 6;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 2, by + 4); ctx.moveTo(bx, by); ctx.lineTo(bx - 2, by + 4); ctx.stroke();
      }
    }
    return { hitR: 16, hitH: 26 };
  }
  const n = 5 + Math.floor(rng() * 3);
  const blobs = [];
  for (let i = 0; i < n; i++) blobs.push([(rng() - 0.5) * 22, -8 - rng() * 10, 7 + rng() * 5]);
  blobs.sort((a, b) => a[1] - b[1]);
  blobs.forEach(([x, y, r]) => leafBlob(ctx, x, y, r, pal, rng));
  if (v % 4 === 1) for (let i = 0; i < 10; i++) { ctx.fillStyle = pick(['#ff5a7a', '#ffd23f', '#fff']); ctx.beginPath(); ctx.arc((rng() - 0.5) * 24, -8 - rng() * 14, 1.4, 0, TAU); ctx.fill(); }
  if (v % 4 === 2) for (let i = 0; i < 6; i++) { ctx.fillStyle = '#d02a2a'; ctx.beginPath(); ctx.arc((rng() - 0.5) * 20, -6 - rng() * 12, 1.8, 0, TAU); ctx.fill(); }
  return { hitR: 16, hitH: 26 };
}
function paintRock(ctx, rng, v, big) {
  const n = big ? 3 : 1;
  groundShadow(ctx, 6, 2, big ? 32 : 18, big ? 13 : 8, 0.4);
  const rocks = [];
  for (let i = 0; i < n; i++) rocks.push([big ? (i - 1) * 14 + (rng() - 0.5) * 6 : 0, big ? (i === 1 ? -4 : 2) : 0, big ? (i === 1 ? 20 : 14) : 11 + rng() * 4]);
  rocks.sort((a, b) => a[1] - b[1]);
  for (const [x, y, r] of rocks) {
    const pts = [];
    const k = 7 + Math.floor(rng() * 3);
    for (let i = 0; i < k; i++) {
      const a = Math.PI + (i / (k - 1)) * Math.PI;
      const rr = r * (0.8 + rng() * 0.35);
      pts.push([x + Math.cos(a) * rr * 1.2, y + Math.sin(a) * rr * (0.95 + rng() * 0.3)]);
    }
    pts.push([x + r * 1.1, y + 2], [x - r * 1.1, y + 2]);
    const g = ctx.createLinearGradient(x - r, y - r, x + r, y + 2);
    g.addColorStop(0, '#b8b0a4'); g.addColorStop(0.5, '#8a8276'); g.addColorStop(1, '#4e4840');
    ctx.fillStyle = g; ctx.strokeStyle = '#3a342c'; ctx.lineWidth = 1;
    ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill(); ctx.stroke();
    // facets
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(x - r * 0.5, y - r * 0.6); ctx.lineTo(x + r * 0.1, y - r * 0.2); ctx.lineTo(x + r * 0.6, y - r * 0.5); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.moveTo(x + r * 0.1, y - r * 0.2); ctx.lineTo(x + r * 0.2, y + 1); ctx.stroke();
    // moss
    ctx.save(); ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.clip();
    for (let i = 0; i < 8; i++) { ctx.fillStyle = rgba(rng() < 0.5 ? '#6a9a3a' : '#4a7a2a', 0.8); ctx.beginPath(); ctx.ellipse(x + (rng() - 0.6) * r * 1.2, y - r * (0.7 + rng() * 0.4), 3 + rng() * 4, 1.6 + rng() * 2, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  // pebbles
  for (let i = 0; i < 4; i++) { ctx.fillStyle = '#7a7266'; ctx.beginPath(); ctx.ellipse((rng() - 0.5) * 34, 2 + rng() * 4, 2, 1.3, 0, 0, TAU); ctx.fill(); }
  return { hitR: big ? 34 : 16, hitH: big ? 34 : 22 };
}

/* ---------- volcano ---------- */
function paintVolcano() {
  const W = 620, Hh = 330;
  return makeSprite(W, Hh + 60, W / 2, Hh, ctx => {
    const rng = mulberry32(77);
    const baseW = 290, topW = 60, h = 250;
    groundShadow(ctx, 40, 10, 300, 90, 0.35);
    // cone body
    const g = ctx.createLinearGradient(-baseW, 0, baseW, 0);
    g.addColorStop(0, '#8a7a6a'); g.addColorStop(0.35, '#6a5a4c'); g.addColorStop(0.7, '#43382e'); g.addColorStop(1, '#2a221c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-baseW, 20);
    ctx.bezierCurveTo(-baseW * 0.6, 10, -topW * 1.6, -h * 0.7, -topW, -h);
    ctx.quadraticCurveTo(0, -h - 10, topW, -h);
    ctx.bezierCurveTo(topW * 1.6, -h * 0.7, baseW * 0.6, 10, baseW, 20);
    ctx.quadraticCurveTo(0, 90, -baseW, 20);
    ctx.closePath(); ctx.fill();
    // erosion ridges
    ctx.save(); ctx.clip();
    for (let i = 0; i < 26; i++) {
      const t = i / 25, x0 = lerp(-topW, topW, t), x1 = lerp(-baseW, baseW, t) + (rng() - 0.5) * 30;
      ctx.strokeStyle = t < 0.5 ? 'rgba(200,180,160,0.18)' : 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2 + rng() * 3;
      ctx.beginPath(); ctx.moveTo(x0, -h + 4); ctx.bezierCurveTo(x0 + (x1 - x0) * 0.2, -h * 0.5, x1 - (x1 - x0) * 0.2, -40, x1, 40); ctx.stroke();
    }
    // lava streams
    for (const [x0, x1] of [[-20, -70], [14, 60]]) {

function buildingSprite(w, h, H, draw) {
  const m = 24;
  const left = h * TW / 2 + m, right = w * TW / 2 + m;
  const top = H + m, bottom = (w + h) * TH / 2 + m;
  const Wd = left + right, Ht = top + bottom;
  let lit = null;
  const s = makeSprite(Wd, Ht, left, top, ctx => {
    lit = makeCanvas(Wd * SPR, Ht * SPR);
    const lctx = lit.getContext('2d'); lctx.scale(SPR, SPR); lctx.translate(left, top);
    const I = new Iso(ctx, lctx);
    draw(I, ctx);
    return { lights: I.lights };
