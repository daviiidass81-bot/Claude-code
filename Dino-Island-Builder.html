/* ---------- helpers ---------- */
function thumbCanvas(sid, stage, w, h) {
  const th = DinoArt.thumb(sid, stage, w, h);
  const cv = makeCanvas(th.width, th.height); cv.getContext('2d').drawImage(th, 0, 0);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  return cv;
}
function spriteBounds(s) {
  if (s.bounds) return s.bounds;
  const c = s.c, d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y += 2) for (let x = 0; x < c.width; x += 2) {
    if (d[(y * c.width + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 <= x0) { x0 = 0; y0 = 0; x1 = c.width; y1 = c.height; }
  return (s.bounds = { x: x0, y: y0, w: x1 - x0 + 2, h: y1 - y0 + 2 });
}
function spriteThumb(cv, s) {
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const b = spriteBounds(s);
  const k = Math.min(cv.width * 0.9 / b.w, cv.height * 0.9 / b.h);
  const w = b.w * k, h = b.h * k;
  ctx.drawImage(s.c, b.x, b.y, b.w, b.h, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
}
function goalIcon(t) {
  return { collect_dino: 'ic-coin', feed: 'ic-crop', clear: 'ic-move', build: 'ic-market', road: 'ic-road', collect_food: 'ic-crop', decode: 'ic-amber', dino_level: 'ic-xp', buy_dino: 'ic-market', hatch: 'ic-lab', deco: 'ic-star', collect_shop: 'ic-coin', level: 'ic-xp', battle_win: 'ic-arena', evolve: 'ic-lab', visitors: 'ic-visitor', league: 'ic-arena', species: 'ic-book' }[t] || 'ic-scroll';
}
function goalText(m) {
  const g = m.goal;
  switch (g.type) {
    case 'collect_dino': return 'Collect dino coins';
    case 'feed': return 'Feed dinosaurs';
    case 'clear': return 'Clear obstacles';
    case 'build': return 'Build ' + BUILDINGS[g.id].name;
    case 'road': return 'Build roads';
    case 'collect_food': return 'Collect a food shipment';
    case 'decode': return 'Decode amber';
    case 'dino_level': return `${SPECIES[g.species].name} to Lv ${g.level}`;
    case 'buy_dino': return g.species ? 'Buy a ' + SPECIES[g.species].name : 'Buy a new dinosaur';
    case 'hatch': return g.species ? 'Hatch a ' + SPECIES[g.species].name : 'Hatch an egg';
    case 'deco': return 'Place decorations';
    case 'collect_shop': return 'Collect from shops';
    case 'level': return 'Reach level ' + g.level;
    case 'battle_win': return 'Win arena battles';
    case 'evolve': return 'Evolve a dinosaur';
    case 'visitors': return 'Visitors in the park';
    case 'league': return 'Win the ' + LEAGUES.find(l => l.id === g.league).name;
    case 'species': return 'Different species';
  }
  return '';
}

/* ---------- advisor portraits (original characters, SVG) ---------- */
function portraitSVG(key) {
  const c = CHARS[key];
  const hair = c.hair, skin = c.skin, out = c.outfit, acc = c.accent;
  const shadeSkin = shade(skin, -0.2);
  let hairBack = '', hairFront = '', extras = '';
  if (key === 'vance') {
    hairBack = `<path d="M44 70 C40 38 62 22 80 22 C100 22 120 36 116 72 C112 60 106 52 80 50 C58 50 50 58 44 70Z" fill="${hair}"/><path d="M50 60 C44 80 46 96 52 104 L56 80Z M110 60 C116 80 114 96 108 104 L104 80Z" fill="${shade(hair, -0.1)}"/>`;
    hairFront = `<path d="M52 56 C60 36 96 32 110 56 C98 46 70 44 52 56Z" fill="${shade(hair, 0.1)}"/>`;
    extras = `<g fill="none" stroke="#2a2a2a" stroke-width="2.4"><rect x="58" y="68" width="18" height="12" rx="4"/><rect x="84" y="68" width="18" height="12" rx="4"/><path d="M76 73h8"/></g><circle cx="80" cy="150" r="5" fill="${acc}"/>`;
  } else if (key === 'quill') {
    hairBack = `<ellipse cx="80" cy="56" rx="40" ry="34" fill="${hair}"/><circle cx="80" cy="24" r="14" fill="${hair}"/>`;
    hairFront = `<path d="M48 64 C52 40 108 40 112 64 C102 50 60 50 48 64Z" fill="${shade(hair, 0.15)}"/>`;
    extras = `<path d="M50 132 L80 170 L110 132 L120 170 L40 170Z" fill="#fff" stroke="#b8c4c8" stroke-width="2"/><path d="M70 136 L80 150 L90 136" fill="none" stroke="${acc}" stroke-width="3"/><rect x="100" y="146" width="10" height="3" fill="${acc}"/>`;
  } else {
    hairBack = `<path d="M50 60 C50 44 64 38 80 38 C96 38 110 44 110 60Z" fill="${hair}"/>`;
    extras = `<path d="M40 50 C50 44 110 44 120 50 L124 56 C100 52 60 52 36 56Z" fill="#c8a060" stroke="#6a4a20" stroke-width="2"/><path d="M54 50 C56 28 104 28 106 50Z" fill="#d8b36a" stroke="#6a4a20" stroke-width="2"/><path d="M54 46 H106" stroke="#6a4a20" stroke-width="3"/>
      <path d="M58 86 C60 104 100 104 102 86 C96 96 64 96 58 86Z" fill="${hair}"/><path d="M68 90 C74 94 86 94 92 90" stroke="${shade(hair, 0.3)}" stroke-width="2" fill="none"/>`;
  }
  return `<svg viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="sk${key}" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="${shade(skin, 0.15)}"/><stop offset="1" stop-color="${shadeSkin}"/></radialGradient>
    <linearGradient id="ou${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(out, 0.15)}"/><stop offset="1" stop-color="${shade(out, -0.3)}"/></linearGradient></defs>
    ${hairBack}
    <path d="M24 170 C26 132 52 120 80 120 C108 120 134 132 136 170Z" fill="url(#ou${key})"/>
    <path d="M68 104 L68 124 C74 130 86 130 92 124 L92 104Z" fill="${shadeSkin}"/>
    <ellipse cx="46" cy="74" rx="6" ry="9" fill="${shadeSkin}"/><ellipse cx="114" cy="74" rx="6" ry="9" fill="${shadeSkin}"/>
    <ellipse cx="80" cy="72" rx="32" ry="38" fill="url(#sk${key})"/>
    ${hairFront}
    <ellipse cx="67" cy="74" rx="4" ry="4.6" fill="#fff"/><ellipse cx="93" cy="74" rx="4" ry="4.6" fill="#fff"/>
    <circle cx="68" cy="75" r="2.6" fill="#2a1a10"/><circle cx="94" cy="75" r="2.6" fill="#2a1a10"/>
    <circle cx="69" cy="74" r=".9" fill="#fff"/><circle cx="95" cy="74" r=".9" fill="#fff"/>
    <path d="M60 64 Q67 60 74 64 M86 64 Q93 60 100 64" stroke="${shade(hair, -0.2)}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M80 78 Q77 88 82 90" stroke="${shade(skin, -0.35)}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M70 97 Q80 104 90 97" stroke="#8a3a2a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="62" cy="88" rx="5" ry="3" fill="#ff8a7a" opacity=".3"/><ellipse cx="98" cy="88" rx="5" ry="3" fill="#ff8a7a" opacity=".3"/>
    ${extras}
  </svg>`;
}

</script>
<script>
'use strict';
/* ==========================================================
   Battle Arena: turn-based Charge / Bite / Swipe combat
   ========================================================== */
const Battle = {
  active: false, cv: null, ctx: null, W: 0, H: 0, dpr: 1,
  me: [], foe: [], mi: 0, fi: 0, phase: 'intro', league: null, round: 0,
  fx: [], nums: [], shake: 0, t: 0, timer: 15, lastBlockMe: false, lastBlockFoe: false, turn: 0,
  anim: { me: { x: 0, pose: 'idle', flash: 0, tint: 0 }, foe: { x: 0, pose: 'idle', flash: 0, tint: 0 } },

  init() {
    this.cv = $('#battleCanvas'); this.ctx = this.cv.getContext('2d');
    $$('#bActions .b-act').forEach(b => b.addEventListener('click', () => { Sfx.click(); this.choose(b.dataset.act); }));
    addEventListener('resize', () => this.active && this.resize());
    addEventListener('keydown', e => {
      if (!this.active || this.phase !== 'choose') return;
      const m = { '1': 'charge', '2': 'bite', '3': 'swipe', '4': 'block', '5': 'special', '6': 'swap' }[e.key];
      if (m) this.choose(m);
    });
  },
  resize() {
    this.dpr = Math.min(devicePixelRatio || 1, 2);
    this.W = innerWidth; this.H = innerHeight;
    this.cv.width = this.W * this.dpr; this.cv.height = this.H * this.dpr;
  },
  fighter(sid, level, stage, o) {
    const sp = SPECIES[sid], st = dinoStats(sp, level, stage);
    return { sid, sp, level, stage, hp: st.hp, maxHp: st.hp, atk: st.atk, weak: sp.weak, meter: 0, o, name: sp.name };
  },
  start(league, objs) {
    this.league = league;
    this.round = G.league.round[league.id] || 0;
    this.me = objs.map(o => this.fighter(o.species, o.level, o.stage || 0, o));
    const rng = Math.random;
    const lo = league.lv[0], hi = league.lv[1];
    const lvl = () => Math.round(lerp(lo, hi, (this.round + rng()) / 3));
    this.foe = [];
    const pool = league.pool.slice();
    for (let i = 0; i < 3; i++) {
      const sid = pool.splice(Math.floor(rng() * pool.length), 1)[0] || pick(league.pool);
      const L = clamp(lvl(), 1, MAX_LEVEL);
      this.foe.push(this.fighter(sid, L, stageOf(L), null));
    }
    this.mi = 0; this.fi = 0; this.fx = []; this.nums = []; this.turn = 0;
    this.lastBlockMe = this.lastBlockFoe = false;
    this.rival = pick(['Emerald Isle Safari', 'Raptor Ridge', 'Cretaceous Cove', 'Fossil Falls', 'Amber Bay Park', 'Thunder Valley', 'Canyon Kings']);
    this.active = true;
    $('#battle').classList.remove('hidden');
    $('#hud').classList.add('hidden');
    UI.hideInfo();
    this.resize();
    this.anim.me = { x: -this.W * 0.6, pose: 'walk', flash: 0, tint: 0, lunge: 0 };
    this.anim.foe = { x: this.W * 0.6, pose: 'walk', flash: 0, tint: 0, lunge: 0 };
    this.crowd = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), c: pick(['#e0513a', '#4aa8e0', '#ffd23f', '#7dc15a', '#fff', '#b35ae0', '#ff8a3a']), p: Math.random() * TAU }));
    $('#bRound').textContent = `${league.name.toUpperCase()} · ROUND ${this.round + 1}`;
    this.hud();
    this.intro();
  },
  async intro() {
    this.phase = 'intro'; this.buttons();
    this.msg(`vs ${this.rival}`);
    await this.tween(900, k => { this.anim.me.x = lerp(-this.W * 0.6, 0, easeOut(k)); this.anim.foe.x = lerp(this.W * 0.6, 0, easeOut(k)); });
    this.anim.me.pose = 'idle'; this.anim.foe.pose = 'idle';
    this.anim.me.pose = 'roar'; Sfx.roar(this.cur().sp.size); this.shake = 6;
    await this.wait(900);
    this.anim.me.pose = 'idle'; this.anim.foe.pose = 'roar'; Sfx.roar(this.enemy().sp.size); this.shake = 6;
    await this.wait(900);
    this.anim.foe.pose = 'idle';
    this.msg('FIGHT!');
    Sfx.fanfare();
    await this.wait(700);
    this.beginTurn();
  },
  cur() { return this.me[this.mi]; },
  enemy() { return this.foe[this.fi]; },
  beginTurn() { this.phase = 'choose'; this.timer = 15; this.buttons(); },
  buttons() {
    const on = this.phase === 'choose';
    const c = this.cur(), e = this.enemy();
    const known = e && (G.pedia[e.sid] && G.pedia[e.sid].weak);
    $$('#bActions .b-act').forEach(b => {
      const a = b.dataset.act;
      let dis = !on;
      if (a === 'special') dis = dis || c.meter < 3;
      if (a === 'block') dis = dis || this.lastBlockMe;
      if (a === 'swap') dis = dis || this.me.filter(f => f.hp > 0).length < 2;
      b.disabled = dis;
      b.classList.toggle('hint', !!(on && known && a === e.weak));
    });
    $('#bSpecial').textContent = `${Math.min(3, c.meter)}/3`;
  },
  hud() {
    const c = this.cur(), e = this.enemy();
    const set = (side, f) => {
      $(`#b${side}Name`).textContent = `${f.name} · Lv ${f.level}`;
      const k = clamp(f.hp / f.maxHp, 0, 1);
      const bar = $(`#b${side}Hp`); bar.style.width = (k * 100) + '%';
      bar.className = k < 0.25 ? 'low' : k < 0.5 ? 'mid' : '';
      $(`#b${side}HpT`).textContent = `${Math.max(0, Math.ceil(f.hp))} / ${f.maxHp}`;
    };
    set('Me', c); set('Foe', e);
    $('#bMeTeam').innerHTML = this.me.map((f, i) => `<i class="${f.hp <= 0 ? 'ko' : ''} ${i === this.mi ? 'act' : ''}"></i>`).join('');
    $('#bFoeTeam').innerHTML = this.foe.map((f, i) => `<i class="${f.hp <= 0 ? 'ko' : ''} ${i === this.fi ? 'act' : ''}"></i>`).join('');
  },
  msg(text) { const m = $('#bMsg'); m.textContent = text; m.classList.remove('show'); void m.offsetWidth; m.classList.add('show'); },
  wait(ms) { return new Promise(r => setTimeout(r, ms)); },
  tween(ms, fn) { return new Promise(r => { const s = performance.now(); const step = () => { const k = Math.min(1, (performance.now() - s) / ms); fn(k); k < 1 ? requestAnimationFrame(step) : r(); }; step(); }); },

  aiChoice() {
    const e = this.enemy(), c = this.cur();
    if (e.meter >= 3 && Math.random() < 0.65) return 'special';
    if (!this.lastBlockFoe && (c.meter >= 3 ? Math.random() < 0.45 : Math.random() < 0.12)) return 'block';
    const knows = this.turn > 1 && Math.random() < 0.35 + this.round * 0.12;
    if (knows) return c.weak;
    return pick(['charge', 'bite', 'swipe']);
  },
  damage(att, def, type) {
    let mult = type === 'special' ? 1.5 : DMG_TABLE[def.weak][type];
    const crit = Math.random() < 0.1;
    const dmg = Math.max(1, Math.round(att.atk * mult * rand(0.9, 1.1) * (crit ? 1.5 : 1)));
    return { dmg, mult, crit };
  },
  async choose(act) {
    if (this.phase !== 'choose') return;
    this.phase = 'resolve'; this.buttons(); this.turn++;
    const eAct = this.aiChoice();
    const meBlock = act === 'block', foeBlock = eAct === 'block';
    // player acts first
    if (act === 'swap') {
      await this.swap('me');
    } else if (!meBlock) {
      await this.attack('me', act, foeBlock);
      if (this.enemy().hp <= 0) { await this.ko('foe'); if (this.over()) return; this.lastBlockMe = false; this.lastBlockFoe = false; return this.beginTurn(); }
    } else { this.fxShield('me'); Sfx.block(); await this.wait(400); }
    // enemy acts
    if (!foeBlock) {
      await this.attack('foe', eAct, meBlock);
      if (this.cur().hp <= 0) { await this.ko('me'); if (this.over()) return; }
    } else if (!(!meBlock && act !== 'swap')) { this.fxShield('foe'); Sfx.block(); await this.wait(400); }
    this.lastBlockMe = meBlock; this.lastBlockFoe = foeBlock;
    this.hud();
    this.beginTurn();
  },
  async attack(side, type, blocked) {
    const att = side === 'me' ? this.cur() : this.enemy(), def = side === 'me' ? this.enemy() : this.cur();
    const A = this.anim[side], D = this.anim[side === 'me' ? 'foe' : 'me'];
    const dir = side === 'me' ? 1 : -1;
    const special = type === 'special';
    if (special) { att.meter = 0; A.pose = 'roar'; Sfx.roar(att.sp.size * 1.2); this.fxAura(side); this.msg(`${att.name}: SPECIAL!`); await this.wait(800); }
    A.pose = 'attack';
    Sfx.whoosh();
    const dist = this.W * 0.2;
    await this.tween(type === 'charge' || special ? 320 : 220, k => { A.x = dir * dist * easeInOut(k); });
    if (blocked) {
      this.fxShield(side === 'me' ? 'foe' : 'me'); Sfx.block();
      this.num(side === 'me' ? 'foe' : 'me', 'BLOCKED', '#8fd3ff');
    } else {
      const r = this.damage(att, def, type);
      def.hp -= r.dmg;
      att.meter = Math.min(3, att.meter + (special ? 0 : 1));
      D.flash = 1; D.pose = 'hurt';
      this.shake = r.crit || special ? 14 : 8;
      if (type === 'swipe') { Sfx.slash(); this.fxSlash(side === 'me' ? 'foe' : 'me'); }
      else if (type === 'bite') { Sfx.chomp(); this.fxBite(side === 'me' ? 'foe' : 'me'); }
      else { Sfx.hit(true); this.fxImpact(side === 'me' ? 'foe' : 'me', special); }
      const col = r.mult >= 1 ? '#ffd23f' : r.mult >= 0.5 ? '#fff' : '#aaa';
      this.num(side === 'me' ? 'foe' : 'me', `-${r.dmg}${r.crit ? '!' : ''}`, col, r.mult >= 1 || special);
      if (side === 'me' && r.mult >= 1 && !special) {
        if (!G.pedia[def.sid] || !G.pedia[def.sid].weak) { G.pedia[def.sid] = { weak: true }; }
        this.msg('WEAK SPOT!');
      } else if (side === 'me' && r.mult <= 0.25) this.msg('Not very effective…');
      if (r.crit) this.msg('CRITICAL!');
      this.hud();
    }
    await this.tween(300, k => { A.x = dir * dist * (1 - easeOut(k)); });
    A.pose = 'idle'; D.pose = def.hp > 0 ? 'idle' : 'hurt';
    await this.wait(250);
  },
  async swap(side) {
    const team = side === 'me' ? this.me : this.foe;
    const idx = side === 'me' ? this.mi : this.fi;
    let n = -1;
    for (let k = 1; k <= team.length; k++) { const j = (idx + k) % team.length; if (team[j].hp > 0 && j !== idx) { n = j; break; } }
    if (n < 0) return;
    const A = this.anim[side], dir = side === 'me' ? -1 : 1;
    await this.tween(350, k => { A.x = dir * this.W * 0.6 * easeInOut(k); });
    if (side === 'me') this.mi = n; else this.fi = n;
    this.hud();
    A.pose = 'walk';
    await this.tween(450, k => { A.x = dir * this.W * 0.6 * (1 - easeOut(k)); });
    A.pose = 'roar'; Sfx.roar((side === 'me' ? this.cur() : this.enemy()).sp.size);
    await this.wait(600); A.pose = 'idle';
    this.buttons();
  },
  async ko(side) {
    const A = this.anim[side];
    const f = side === 'me' ? this.cur() : this.enemy();
    this.msg(`${f.name} is knocked out!`);
    A.pose = 'sleep'; Sfx.hit(true); this.shake = 10;
    await this.wait(1100);
    const team = side === 'me' ? this.me : this.foe;
    if (team.some(x => x.hp > 0)) {
      await this.swap(side);
      this.lastBlockMe = this.lastBlockFoe = false;
    }
  },
  over() {
    const meAlive = this.me.some(f => f.hp > 0), foeAlive = this.foe.some(f => f.hp > 0);
    if (meAlive && foeAlive) return false;
    this.finish(meAlive);
    return true;
  },
  finish(win) {
    this.phase = 'end'; this.buttons();
    const L = this.league, li = LEAGUES.indexOf(L);
    G.stats.battles++;
    let html, reward = { coins: 0, bucks: 0, xp: 0 }, champion = false, amber = null;
    if (win) {
      G.stats.battlesWon++;
      missionEvent('battle_win');
      const base = Math.round(L.fee * (1.6 + this.round * 0.6));
      reward = { coins: base, bucks: this.round === 2 ? 2 : 0, xp: Math.round(L.reward.xp * 0.25 * (1 + this.round * 0.5)) };
      this.round++;
      if (this.round >= 3) {
        champion = true; this.round = 0;
        reward.coins += L.reward.coins; reward.bucks += L.reward.bucks; reward.xp += L.reward.xp;
        G.league.best = Math.max(G.league.best, li);
      }
      if (Math.random() < 0.35) amber = rollAmber(true);
      Sfx.win();
      this.anim.me.pose = 'roar';
    } else {
      this.round = 0;
      Sfx.lose();
      reward.xp = 20;
    }
    G.league.round[L.id] = this.round;
    if (reward.coins) gain('coins', reward.coins, 'arena');
    if (reward.bucks) gain('bucks', reward.bucks, 'arena');
    if (reward.xp) addXP(reward.xp, 'arena');
    html = `<div class="modal-card" style="max-width:520px;text-align:center">
      <div class="modal-head"><h2>${win ? (champion ? '🏆 CHAMPION!' : 'VICTORY!') : 'DEFEAT'}</h2></div>
      <div class="modal-body">
        <p style="font-weight:800;font-size:16px">${win ? (champion ? `You won the ${esc(L.name)}!` : `Round ${this.round} of 3 won against ${esc(this.rival)}.`) : `${esc(this.rival)} was too strong this time. Level up your dinosaurs and try again!`}</p>
        <p style="font:400 22px 'Lilita One';color:#ffd479">${reward.coins ? `<i class="ic ic-coin"></i> +${fmt(reward.coins)} ` : ''}${reward.bucks ? `<i class="ic ic-buck"></i> +${reward.bucks} ` : ''}<i class="ic ic-xp"></i> +${fmt(reward.xp)}</p>
        ${amber ? `<p style="font-weight:800"><i class="ic ic-amber"></i> Bonus: you received ${esc(SPECIES[amber].name)} amber!</p>` : ''}
        <div class="btn-row" style="justify-content:center"><button class="btn btn-gold big" id="bDone" type="button">Continue</button></div>
      </div></div>`;
    const ov = el('div', 'modal', html); ov.style.zIndex = 40;
    setTimeout(() => {
      document.body.appendChild(ov);
      if (win) for (let i = 0; i < 3; i++) setTimeout(() => this.fx.push({ type: 'confetti', t: 0, parts: Array.from({ length: 50 }, () => ({ x: rand(0, this.W), y: -20, vx: rand(-60, 60), vy: rand(80, 220), c: pick(['#e0513a', '#4aa8e0', '#ffd23f', '#7dc15a']), r: rand(0, 6) })) }), i * 300);
      $('#bDone').addEventListener('click', () => { Sfx.click(); ov.remove(); this.close(); if (champion) UI.toast(`🏆 ${L.name} champion!`, 'good big'); });
    }, 1200);
    saveGame();
  },
  close() {
    this.active = false;
    $('#battle').classList.add('hidden');
    $('#hud').classList.remove('hidden');
    Bus.emit('missions');
  },

  /* ---------- effects ---------- */
  pos(side) { const k = side === 'me' ? 0.28 : 0.72; return { x: this.W * k + this.anim[side].x, y: this.H * 0.74 }; },
  fxSlash(side) { const p = this.pos(side); this.fx.push({ type: 'slash', t: 0, x: p.x, y: p.y - this.H * 0.16 }); },
  fxBite(side) { const p = this.pos(side); this.fx.push({ type: 'bite', t: 0, x: p.x, y: p.y - this.H * 0.16 }); },
  fxImpact(side, big) { const p = this.pos(side); this.fx.push({ type: 'impact', t: 0, x: p.x, y: p.y - this.H * 0.12, big }); for (let i = 0; i < 16; i++) this.fx.push({ type: 'dust', t: 0, x: p.x + rand(-40, 40), y: p.y, vx: rand(-120, 120), vy: rand(-80, -10), r: rand(10, 24) }); },
  fxShield(side) { const p = this.pos(side); this.fx.push({ type: 'shield', t: 0, side }); },
  fxAura(side) { this.fx.push({ type: 'aura', t: 0, side }); },
  num(side, text, col, big) { const p = this.pos(side); this.nums.push({ x: p.x + rand(-20, 20), y: p.y - this.H * 0.28, text, col, t: 0, big }); },

  /* ---------- render ---------- */
  update(dt) {
    if (!this.active) return;
    this.t += dt;
    if (this.phase === 'choose') {
      this.timer -= dt;
      $('#bTimer').style.width = (Math.max(0, this.timer) / 15 * 100) + '%';
      if (this.timer <= 0) this.choose(pick(['charge', 'bite', 'swipe']));
    }
    for (const s of ['me', 'foe']) this.anim[s].flash = Math.max(0, this.anim[s].flash - dt * 4);
    this.shake *= Math.pow(0.02, dt);
    this.draw(dt);
  },
  draw(dt) {
    const ctx = this.ctx, W = this.W, H = this.H, t = this.t;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const sx = rand(-1, 1) * this.shake, sy = rand(-1, 1) * this.shake;
    ctx.save(); ctx.translate(sx, sy);
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    sky.addColorStop(0, '#f08a4a'); sky.addColorStop(0.45, '#f4c07a'); sky.addColorStop(1, '#ffe2a8');
    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);
    // sun
    const sg = ctx.createRadialGradient(W * 0.5, H * 0.34, 10, W * 0.5, H * 0.34, H * 0.3);
    sg.addColorStop(0, 'rgba(255,250,220,1)'); sg.addColorStop(0.2, 'rgba(255,230,160,0.8)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
    // distant volcano & jungle
    ctx.fillStyle = '#b86a4a'; ctx.beginPath(); ctx.moveTo(W * 0.05, H * 0.5); ctx.lineTo(W * 0.22, H * 0.2); ctx.lineTo(W * 0.3, H * 0.2); ctx.lineTo(W * 0.5, H * 0.5); ctx.fill();
    ctx.fillStyle = 'rgba(80,40,30,0.4)'; for (let i = 0; i < 4; i++) { const k = (t * 0.05 + i / 4) % 1; ctx.beginPath(); ctx.arc(W * 0.26 + k * 40, H * 0.2 - k * H * 0.15, 10 + k * 30, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#4a6a3a';
    ctx.beginPath(); ctx.moveTo(0, H * 0.5);
    for (let x = 0; x <= W; x += 30) ctx.lineTo(x, H * 0.44 - Math.abs(Math.sin(x * 0.013)) * 30 - Math.sin(x * 0.05) * 8);
    ctx.lineTo(W, H * 0.5); ctx.fill();
    // arena wall with crowd
    const wallTop = H * 0.42, wallBot = H * 0.6;
    const wg = ctx.createLinearGradient(0, wallTop, 0, wallBot);
    wg.addColorStop(0, '#9a8468'); wg.addColorStop(1, '#6a5640');
    ctx.fillStyle = wg; ctx.fillRect(0, wallTop, W, wallBot - wallTop);
    for (const c of this.crowd) {
      const cx = c.x * W, cy = wallTop + 8 + c.y * (wallBot - wallTop - 36);
      const jump = this.phase === 'end' || Math.sin(t * 6 + c.p) > 0.85 ? Math.abs(Math.sin(t * 10 + c.p)) * 4 : 0;
      ctx.fillStyle = c.c; ctx.beginPath(); ctx.arc(cx, cy - jump, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8b58e'; ctx.beginPath(); ctx.arc(cx, cy - 6 - jump, 3, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#5a4630'; ctx.fillRect(0, wallBot - 22, W, 22);
    ctx.fillStyle = '#3a2c1c'; for (let x = 0; x < W; x += 60) ctx.fillRect(x, wallBot - 22, 4, 22);
    // banners
    for (let i = 0; i < 6; i++) {
      const bx = W * (0.08 + i * 0.17);
      ctx.fillStyle = i % 2 ? '#c8402a' : '#e8a020';
      ctx.beginPath(); ctx.moveTo(bx - 16, wallTop - 4); ctx.lineTo(bx + 16, wallTop - 4); ctx.lineTo(bx + 16, wallTop + 40 + Math.sin(t * 2 + i) * 2); ctx.lineTo(bx, wallTop + 30); ctx.lineTo(bx - 16, wallTop + 40 + Math.sin(t * 2 + i) * 2); ctx.fill();
    }
    // torches
    for (const tx of [W * 0.03, W * 0.97]) {
      ctx.fillStyle = '#4a3020'; ctx.fillRect(tx - 5, wallTop - 20, 10, 60);
      const f = 1 + Math.sin(t * 18) * 0.1;
      const fg = ctx.createRadialGradient(tx, wallTop - 30, 2, tx, wallTop - 30, 40 * f);
      fg.addColorStop(0, 'rgba(255,240,180,1)'); fg.addColorStop(0.3, 'rgba(255,160,50,0.8)'); fg.addColorStop(1, 'rgba(255,100,20,0)');
      ctx.fillStyle = fg; ctx.fillRect(tx - 50, wallTop - 80, 100, 100);
    }
    // sand floor
    const fl = ctx.createLinearGradient(0, wallBot, 0, H);
    fl.addColorStop(0, '#d8b880'); fl.addColorStop(1, '#b8904e');
    ctx.fillStyle = fl; ctx.fillRect(0, wallBot, W, H - wallBot);
    ctx.strokeStyle = 'rgba(120,80,40,0.25)'; ctx.lineWidth = 2;
    for (let i = 0; i < 18; i++) { const y = wallBot + 10 + i * i * 1.4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + Math.sin(i) * 6); ctx.stroke(); }
    // fighters
    const scaleBase = Math.min(W / 900, H / 620) * 1.35;
    for (const side of ['me', 'foe']) {
      const f = side === 'me' ? this.cur() : this.enemy();
      if (!f) continue;
      const A = this.anim[side], p = this.pos(side);
      const size = DinoArt.size(f.sid);
      const sc = scaleBase * clamp(260 / size.len, 0.55, 1.4) * (0.75 + 0.25 * f.sp.size);
      const pose = A.pose === 'walk' ? 'walk' : A.pose;
      DinoArt.draw(ctx, f.sid, p.x, p.y, sc, { stage: f.stage, dir: side === 'me' ? 1 : -1, t: t + (side === 'me' ? 0 : 2), pose, speed: A.pose === 'walk' ? 1 : 0, phase: t * 1.4, fly: f.sp.aviary ? 60 * sc : 0 });
      if (A.flash > 0) {
        ctx.save(); ctx.globalAlpha = A.flash * 0.7;
        DinoArt.draw(ctx, f.sid, p.x, p.y, sc, { stage: f.stage, dir: side === 'me' ? 1 : -1, t: t + (side === 'me' ? 0 : 2), pose, shadow: false, palette: P('#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff'), fly: f.sp.aviary ? 60 * sc : 0 });
        ctx.restore();
      }
      // special meter pips
      for (let i = 0; i < 3; i++) { ctx.fillStyle = i < f.meter ? '#ffb13b' : 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(p.x - 16 + i * 16, p.y + 22, 5, 0, TAU); ctx.fill(); }
    }
    // fx
    for (const e of this.fx) {
      e.t += dt;
      if (e.type === 'slash') {
        const k = e.t / 0.4; ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 6 * (1 - k) + 1;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(e.x - 60 + i * 22, e.y - 60); ctx.quadraticCurveTo(e.x + i * 22, e.y - 10, e.x - 20 + i * 22, e.y + 60 * Math.min(1, k * 3)); ctx.stroke(); }
      } else if (e.type === 'bite') {
        const k = e.t / 0.45, close = Math.min(1, k * 3);
        ctx.fillStyle = `rgba(255,255,255,${1 - k})`;
        for (const s of [-1, 1]) for (let i = 0; i < 6; i++) { const x = e.x - 50 + i * 20, y = e.y + s * (50 - close * 36); ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x, y - s * 20); ctx.lineTo(x + 8, y); ctx.fill(); }
      } else if (e.type === 'impact') {
        const k = e.t / 0.5; ctx.strokeStyle = `rgba(255,230,140,${1 - k})`; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(e.x, e.y, (e.big ? 140 : 80) * easeOut(k), 0, TAU); ctx.stroke();
        ctx.fillStyle = `rgba(255,255,200,${(1 - k) * 0.8})`;
        ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, r = (i % 2 ? 20 : 50) * (1 + k); ctx.lineTo(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r); } ctx.fill();
      } else if (e.type === 'dust') {
        e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 40 * dt;
        ctx.fillStyle = `rgba(200,170,120,${Math.max(0, 0.6 - e.t)})`; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1 + e.t), 0, TAU); ctx.fill();
      } else if (e.type === 'shield') {
        const p = this.pos(e.side), k = e.t / 0.8;
        ctx.strokeStyle = `rgba(140,210,255,${1 - k})`; ctx.fillStyle = `rgba(100,180,255,${0.25 * (1 - k)})`; ctx.lineWidth = 4;
        ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6; ctx.lineTo(p.x + (e.side === 'me' ? 70 : -70) + Math.cos(a) * 90, p.y - this.H * 0.14 + Math.sin(a) * 110); } ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (e.type === 'aura') {
        const p = this.pos(e.side), k = e.t / 1;
        const g = ctx.createRadialGradient(p.x, p.y - 60, 10, p.x, p.y - 60, 200);
        g.addColorStop(0, `rgba(255,200,80,${0.5 * (1 - k)})`); g.addColorStop(1, 'rgba(255,120,20,0)');
        ctx.fillStyle = g; ctx.fillRect(p.x - 220, p.y - 280, 440, 440);
      } else if (e.type === 'confetti') {
        for (const q of e.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.r += dt * 5; ctx.fillStyle = q.c; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillRect(-5, -2, 10, 4); ctx.restore(); }
      }
    }
    this.fx = this.fx.filter(e => e.t < (e.type === 'confetti' ? 4 : e.type === 'aura' ? 1 : 0.9));
    for (const n of this.nums) {
      n.t += dt; n.y -= 50 * dt;
      ctx.globalAlpha = clamp(1.4 - n.t, 0, 1);
      ctx.font = `400 ${n.big ? 44 : 32}px 'Lilita One', sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(n.text, n.x, n.y);
      ctx.fillStyle = n.col; ctx.fillText(n.text, n.x, n.y);
    }
    ctx.globalAlpha = 1;
    this.nums = this.nums.filter(n => n.t < 1.4);
    ctx.restore();
    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  },
};

</script>
<script>
'use strict';
/* ==========================================================
   Game controller & main loop
   ========================================================== */
const Game = {
  mode: 'title', roadErase: false, placing: null, hint: null, roadStroke: 0, lastSave: 0, started: false,

  /* ---------- modes & tools ---------- */
  setMode(m) {
    if (this.mode === 'place' && m !== 'place') this.cancelPlace(true);
    this.mode = m;
    Render.roadMode = m === 'road' ? (this.roadErase ? 'erase' : 'paint') : null;
    $('#modebar').classList.toggle('hidden', !(m === 'road' || m === 'edit'));
    if (m === 'road') { $('#modeText').innerHTML = this.roadErase ? 'Erase roads – drag over tiles' : `Road mode – drag to build (<i class="ic ic-coin"></i>${ROAD_COST}/tile)`; $('#modeAlt').classList.remove('hidden'); $('#modeAlt').textContent = this.roadErase ? 'Build' : 'Erase'; }
    if (m === 'edit') { $('#modeText').textContent = 'Edit mode – tap something to move it'; $('#modeAlt').classList.add('hidden'); }
    $('#placebar').classList.toggle('hidden', m !== 'place');
    this.refreshToolbar();
  },
  refreshToolbar() {
    $$('#toolbar .tool').forEach(b => {
      const t = b.dataset.tool;
      b.classList.toggle('active', (t === 'road' && this.mode === 'road') || (t === 'edit' && this.mode === 'edit') || (UI.modalKind && ({ market: 'market', lab: 'lab', missions: 'missions', arena: 'arena', dinopedia: 'pedia' })[t] === UI.modalKind));
    });
  },
  toggleTool(t) {
    UI.hideInfo();
    switch (t) {
      case 'market': UI.market(); break;
      case 'road': this.setMode(this.mode === 'road' ? 'normal' : 'road'); break;
      case 'edit': this.setMode(this.mode === 'edit' ? 'normal' : 'edit'); break;
      case 'lab': UI.lab(); break;
      case 'arena': UI.arena(); break;
      case 'missions': UI.missions(); break;
      case 'dinopedia': UI.dinopedia(); break;
    }
    this.refreshToolbar();
  },
  toggleRoadErase() { this.roadErase = !this.roadErase; this.setMode('road'); },
  escape() {
    if (Battle.active) return;
    if (UI.modalOpen()) return UI.closeModal();
    if (this.mode === 'place') return this.cancelPlace();
    if (this.mode !== 'normal') return this.setMode('normal');
    UI.hideInfo();
  },

  /* ---------- pointer ---------- */
  hoverAt(sx, sy) {
    const ref = Render.pick(sx, sy);
    Render.cv.style.cursor = ref ? 'pointer' : '';
  },
  tap(sx, sy) {
    Sfx.init();
    if (this.mode === 'title') return;
    const tile = Render.s2t(sx, sy);
    if (this.mode === 'place') {
      const nx = tile.x - Math.floor((this.placing.w - 1) / 2), ny = tile.y - Math.floor((this.placing.h - 1) / 2);
      const g = Render.ghost;
      if (g && tile.x >= g.x && tile.x < g.x + g.w && tile.y >= g.y && tile.y < g.y + g.h && g.valid) return this.confirmPlace();
      this.moveGhost(nx, ny); return;
    }
    if (this.mode === 'road') return;
    const ref = Render.pick(sx, sy);
    if (this.mode === 'edit') {
      const o = ref && (ref.kind === 'obj' || ref.kind === 'dino' || ref.kind === 'bubble') ? ref.o : World.objAt(tile.x, tile.y);
      if (o && o.def !== 'gate') { this.startMove(o); }
      return;
    }
    if (!ref) {
      const o = World.objAt(tile.x, tile.y);
      if (o) return this.select(o, sx, sy);
      if (World.inMap(tile.x, tile.y) && World.obs[World.idx(tile.x, tile.y)]) return this.select({ kind: 'obs', x: tile.x, y: tile.y }, sx, sy);
      UI.hideInfo();
      return;
    }
    if (ref.kind === 'bubble') return this.collectFrom(ref.o, sx, sy);
    if (ref.kind === 'dino' || ref.kind === 'obj') {
      const o = ref.o;
      if (ref.kind === 'dino') { const a = Entities.dinos.get(o.id); if (a && o.hatchEnd <= now() && Math.random() < 0.5) a.roar(); }
      return this.select(o, sx, sy);
    }
    if (ref.kind === 'obs') return this.select(ref, sx, sy);
  },
  select(ref, sx, sy) {
    Sfx.click();
    // quick-collect when something is ready
    if (ref.type && this.collectFrom(ref, sx, sy, true)) return;
    UI.showInfo(ref);
  },

  /* ---------- collecting ---------- */
  collectFrom(o, sx, sy, quiet) {
    const nowT = now();
    if (o.type === 'paddock') {
      if (o.hatchEnd > nowT) return false;
      if (o.coins >= Math.max(1, dinoCap(o) * 0.05)) { this.collectDino(o, sx, sy); return !quiet || true; }
      return false;
    }
    if (o.type !== 'building') return false;
    const b = BUILDINGS[o.def];
    if ((b.kind === 'shop' || b.kind === 'center') && nowT - o.start >= b.period * 1000) { this.collectShop(o, sx, sy); return true; }
    if (b.kind === 'harbor' && o.order && nowT >= o.order.end) { this.collectFood(o, sx, sy); return true; }
    if (b.kind === 'lab' && G.lab && nowT >= G.lab.end) { this.claimLab(); return true; }
    if (!quiet) { UI.showInfo(o); return true; }
    return false;
  },
  collectDino(o, sx, sy) {
    const amt = Math.floor(o.coins);
    if (amt < 1) return;
    o.coins -= amt;
    gain('coins', amt, 'dino');
    addXP(Math.max(1, Math.round(amt / 25)), 'dino');
    G.stats.collected += amt;
    missionEvent('collect_dino');
    Sfx.cash();
    const w = World.toWorld(o.x + o.w / 2, o.y + o.h / 2);
    Entities.float(w.x, w.y - 80, '+' + fmt(amt), '#ffd479', 20);
    Entities.emit(w.x, w.y - 70, 'spark', 12);
    UI.fly('coins', sx, sy, Math.min(8, 3 + Math.floor(amt / 100)));
    UI.renderInfo(true);
  },
  collectShop(o, sx, sy) {
    const amt = shopIncome(o), b = BUILDINGS[o.def];
    o.start = now();
    gain('coins', amt, 'shop'); addXP(Math.max(2, Math.round(amt / 30)), 'shop');
    missionEvent('collect_shop');
    Sfx.cash();
    const w = World.toWorld(o.x + o.w / 2, o.y + o.h / 2);
    Entities.float(w.x, w.y - 90, '+' + fmt(amt), '#ffd479', 20);
    Entities.emit(w.x, w.y - 80, 'spark', 10);
    UI.fly('coins', sx, sy, 5);
    UI.renderInfo(true);
  },
  collectFood(o, sx, sy) {
    const food = BUILDINGS[o.def].food, amt = o.order.amount;
    o.order = null;
    gain(food, amt, 'harbor'); addXP(10, 'harbor');
    missionEvent('collect_food');
    Sfx.food();
    const w = World.toWorld(o.x + o.w / 2, o.y + o.h / 2);
    Entities.float(w.x, w.y - 90, `+${fmt(amt)} ${food}`, food === 'crops' ? '#b6e27a' : '#ff9a8a', 20);
    Entities.emit(w.x, w.y - 60, 'food', 14, { col: food === 'crops' ? '#7ac04a' : '#c8402a' });
    UI.fly(food, sx, sy, 6);
    if (UI.infoObj === o) UI.renderInfo();
  },

  /* ---------- object actions (from info panel) ---------- */
  action(act, o, btn) {
    const r = btn.getBoundingClientRect(), sx = r.left + r.width / 2, sy = r.top + r.height / 2;
    if (act === 'collect') return this.collectDino(o, sx, sy);
    if (act === 'collectShop') return this.collectShop(o, sx, sy);
    if (act === 'collectFood') return this.collectFood(o, sx, sy);
    if (act === 'feed') return this.feed(o, sx, sy);
    if (act === 'evolve') return this.evolve(o);
    if (act === 'roar') { const a = Entities.dinos.get(o.id); if (a) a.roar(); return; }
    if (act === 'move') return this.startMove(o);
    if (act === 'sell') return this.sell(o);
    if (act === 'hatchNow') { const c = speedCost(o.hatchEnd - now()); if (spend({ bucks: c })) { o.hatchEnd = now(); } return; }
    if (act === 'openLab') { UI.hideInfo(); return UI.lab(); }
    if (act === 'openArena') { UI.hideInfo(); return UI.arena(); }
    if (act.startsWith('order')) return this.orderFood(o, +act.slice(5));
    if (act === 'rushFood') { const c = speedCost(o.order.end - now()); if (spend({ bucks: c })) { o.order.end = now(); UI.renderInfo(); } return; }
    if (act === 'clear') return this.startClear(o);
    if (act === 'rushClear') { const job = G.clearing.find(c => c.i === World.idx(o.x, o.y)); if (job && spend({ bucks: speedCost(job.end - now()) })) { job.end = now(); } return; }
  },
  feed(o, sx, sy) {
    const sp = SPECIES[o.species], food = sp.diet === 'herb' ? 'crops' : 'meat';
    if (o.level >= maxLevelForStage(o.stage || 0)) return;
    const cost = feedCost(o);
    if (!spend({ [food]: cost })) { UI.toast(food === 'crops' ? 'Order crops at the Crop Harbor!' : 'Order meat at the Meat Harbor!', 'err'); return; }
    o.feeds++;
    G.stats.fed++;
    missionEvent('feed', { species: o.species });
    Sfx.food();
    const a = Entities.dinos.get(o.id); if (a) a.eatNow();
    const w = World.toWorld(o.x + o.w - 1.2, o.y + o.h - 0.8);
    Entities.emit(w.x, w.y - 10, 'food', 10, { col: food === 'crops' ? '#7ac04a' : '#c8402a' });
    addXP(3 + o.level, 'feed');
    if (o.feeds >= FEEDS_PER_LEVEL) {
      o.feeds = 0; o.level++;
      const c = World.toWorld(o.x + o.w / 2, o.y + o.h / 2);
      Entities.float(c.x, c.y - 100, `Level ${o.level}!`, '#b6e27a', 22);
      Entities.emit(c.x, c.y - 60, 'star', 14);
      Sfx.levelUp();
      if (o.level === [5, 15, 25, 35][o.stage || 0]) UI.toast(`Your ${sp.name} is now an adult!`, 'good');
      if (STAGE_LEVELS.includes(o.level)) UI.toast(`${sp.name} is ready to evolve! Research it in the Lab.`, 'good');
    }
    UI.renderInfo();
  },
  evolve(o) {
    const st = o.stage || 0;
    if (st >= 3 || o.level < maxLevelForStage(st) || (G.stageResearch[o.species] || 0) < st + 1) return;
    o.stage = st + 1; o.level++; o.feeds = 0;
    missionEvent('evolve', { species: o.species });
    addXP(150 * o.stage, 'evolve');
    const c = World.toWorld(o.x + o.w / 2, o.y + o.h / 2);
    Entities.emit(c.x, c.y - 50, 'star', 30, { col: '#e8b0ff' });
    Entities.emit(c.x, c.y - 50, 'confetti', 30);
    Entities.float(c.x, c.y - 110, `${STAGE_NAMES[o.stage]}!`, '#e8b0ff', 26);
    Sfx.hatch();
    const a = Entities.dinos.get(o.id); if (a) setTimeout(() => a.roar(), 600);
    UI.toast(`${SPECIES[o.species].name} evolved to ${STAGE_NAMES[o.stage]}!`, 'good big');
    UI.renderInfo();
  },
  orderFood(o, idx) {
    if (o.order) return;
    const cost = harborOrderCost(o, idx);
    if (!spend({ coins: cost })) return;
    const h = HARBOR_ORDERS[idx];
    o.order = { idx, start: now(), end: now() + h.time * 1000, amount: h.amount };
    Sfx.click(); Sfx.whoosh();
    missionEvent('order_food');
    UI.toast(`${h.name} ordered – arriving in ${fmtTime(h.time * 1000)}`, 'good');
    UI.renderInfo();
  },
  sell(o) {
    const def = defOf(o);
    if (def.noSell) return;
    const refund = Math.round(coinsEquiv(def.cost) * (o.type === 'deco' ? 0.5 : 0.3));
    const name = def.name;
    if (!confirm(`Sell ${name} for ${fmt(refund)} coins?`)) return;
    removeObject(o);
    gain('coins', refund, 'sell');
    Entities.syncDinos();
    UI.hideInfo();
    Sfx.build();
    UI.toast(`${name} sold for ${fmt(refund)} coins`);
  },

  /* ---------- clearing obstacles ---------- */
  startClear(ref) {
    const i = World.idx(ref.x, ref.y), kind = OBS_KIND[World.obs[i]];
    if (!kind || G.clearing.some(c => c.i === i)) return;
    if (G.clearing.length >= maxWorkers()) { UI.toast(`All workers are busy (${maxWorkers()}). Build a Ranger Station for more!`, 'err'); return; }
    if (!spend({ coins: clearCost(kind) })) return;
    G.clearing.push({ i, start: now(), end: now() + clearTime(kind) });
    Sfx.chop();
    UI.renderInfo();
  },
  finishClear(job) {
    const x = job.i % MAP, y = Math.floor(job.i / MAP);
    const kind = OBS_KIND[World.obs[job.i]];
    World.obs[job.i] = 0;
    G.clearing = G.clearing.filter(c => c !== job);
    G.stats.cleared++;
    missionEvent('clear');
    const w = World.toWorld(x + 0.5, y + 0.5);
    Entities.emit(w.x, w.y - 20, kind === 'rock' || kind === 'bigrock' ? 'dust' : 'leaf', 18);
    Entities.emit(w.x, w.y, 'dust', 8);
    if (Render.onScreen(x, y)) Sfx.timber();
    addXP(CLEAR[kind].xp, 'clear');
    Entities.float(w.x, w.y - 50, `+${CLEAR[kind].xp} XP`, '#8fd3ff', 16);
    const amber = rollAmber(G.stats.cleared === 2);
    if (amber) {
      Entities.emit(w.x, w.y - 30, 'star', 20, { col: '#ffb13b' });
      Entities.float(w.x, w.y - 75, 'AMBER!', '#ffb13b', 24);
      Sfx.amber();
      UI.toast(`<i class="ic ic-amber"></i> Amber found! It contains ${esc(SPECIES[amber].name)} DNA.`, 'good big', 4000);
      const s = Render.w2s(w.x, w.y - 30); UI.fly('amber', s.x, s.y, 3);
      if (!G.tutorialAmber) { G.tutorialAmber = true; UI.advisor('quill', `Incredible! This amber holds a mosquito with ${SPECIES[amber].name} DNA. Bring it to the Genetics Lab and I'll decode it!`); }
    }
    if (UI.infoObj && UI.infoObj.kind === 'obs' && UI.infoObj.x === x && UI.infoObj.y === y) UI.hideInfo();
  },

  /* ---------- roads ---------- */
  paintRoad(tile) {
    const { x, y } = tile;
    if (!World.inMap(x, y)) return;
    const i = World.idx(x, y);
    if (this.roadErase) {
      if (!World.roads[i]) return;
      const gate = G.objects.find(o => o.def === 'gate');
      if (gate && x === gate.x + 1 && y === gate.y) return;
      World.roads[i] = 0; World.countRoads(); gain('coins', Math.round(ROAD_COST / 2));
      Sfx.road();
      return;
    }
    if (World.roads[i] || !World.canPlace(x, y, 1, 1)) return;
    if (!spend({ coins: ROAD_COST })) return;
    World.roads[i] = 1; World.countRoads();
    this.roadStroke++;
    missionEvent('road');
    Sfx.road();
    const w = World.toWorld(x + 0.5, y + 0.5);
    Entities.emit(w.x, w.y, 'dust', 3);
  },
  endRoadStroke() { if (this.roadStroke) addXP(this.roadStroke, 'road'); this.roadStroke = 0; saveGame(); },

  /* ---------- placement ---------- */
  startPlace(type, def, moving) {
    UI.hideInfo();
    let w, h;
    if (type === 'paddock') w = h = SPECIES[def].pad; else if (type === 'deco') [w, h] = DECOS[def].size; else [w, h] = BUILDINGS[def].size;
    // start near the screen center on a free spot
    const c = Render.s2t(Render.W / 2, Render.H / 2);
    let best = { x: c.x - Math.floor(w / 2), y: c.y - Math.floor(h / 2) };
    outer: for (let r = 0; r < 14; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = c.x - Math.floor(w / 2) + dx, y = c.y - Math.floor(h / 2) + dy;
      if (World.canPlace(x, y, w, h, moving ? moving.id : 0)) { best = { x, y }; break outer; }
    }
    this.placing = { type, def, w, h, moving };
    Render.ghost = { type, def, w, h, x: best.x, y: best.y, valid: false, moving };
    this.mode = 'place';
    this.setMode('place');
    this.moveGhost(best.x, best.y);
    const name = type === 'paddock' ? SPECIES[def].name : type === 'deco' ? DECOS[def].name : BUILDINGS[def].name;
    $('#placeText').innerHTML = `${moving ? 'Move' : 'Place'} <b>${esc(name)}</b> – drag or tap to position`;
  },
  moveGhost(x, y) {
    const g = Render.ghost; if (!g) return;
    g.x = clamp(x, 0, MAP - g.w); g.y = clamp(y, 0, MAP - g.h);
    g.valid = World.canPlace(g.x, g.y, g.w, g.h, g.moving ? g.moving.id : 0);
    $('#placeOk').disabled = !g.valid;
  },
  moveGhostDone() {},
  confirmPlace() {
    const g = Render.ghost, p = this.placing;
    if (!g || !p || !g.valid) { Sfx.error(); return; }
    if (p.moving) {
      const o = p.moving;
      o.x = g.x; o.y = g.y;
      World.rebuildOcc(); recomputeBonuses();
      const a = Entities.dinos.get(o.id); if (a) { a.x = o.x + o.w / 2; a.y = o.y + o.h / 2; a.tx = a.x; a.ty = a.y; }
      Sfx.build();
    } else {
      const def = p.type === 'paddock' ? SPECIES[p.def] : p.type === 'deco' ? DECOS[p.def] : BUILDINGS[p.def];
      if (!spend(def.cost)) return;
      const o = makeObject(p.type, p.def, g.x, g.y);
      addObject(o);
      Sfx.build();
      if (p.type === 'paddock') { Entities.syncDinos(); missionEvent('buy_dino', { species: p.def }); addXP(20 + def.level * 5, 'buy'); UI.toast(`${def.name} egg placed! It will hatch in ${fmtTime(def.hatch * 1000)}.`, 'good'); }
      else if (p.type === 'deco') { missionEvent('deco'); addXP(5, 'deco'); }
      else { missionEvent('build', { id: p.def }); addXP(def.xp || 20, 'build'); }
      const c = World.toWorld(g.x + g.w / 2, g.y + g.h / 2);
      Entities.emit(c.x, c.y, 'dust', 20); Entities.emit(c.x, c.y - 30, 'star', 10);
      Render.shake(3);
      // keep placing decorations & roads quickly
      if (p.type === 'deco' && canAfford(def.cost)) { this.moveGhost(g.x, g.y); saveGame(); return; }
    }
    this.placing = null; Render.ghost = null;
    this.setMode('normal');
    saveGame();
  },
  cancelPlace(silent) {
    this.placing = null; Render.ghost = null;
    if (!silent) { this.setMode('normal'); Sfx.close(); }
  },
  startMove(o) {
    if (o.def === 'gate') return;
    UI.hideInfo();
    const type = o.type, def = o.type === 'paddock' ? o.species : o.def;
    this.startPlace(type, def, o);
    this.moveGhost(o.x, o.y);
  },

  /* ---------- lab ---------- */
  startDecode(sid) {
    if (G.lab || !G.amber[sid]) return;
    const c = decodeCost(sid);
    if (!spend({ coins: c.coins })) return;
    G.amber[sid]--;
    startLab({ type: 'decode', species: sid, start: now(), end: now() + c.time * 1000 });
    Sfx.amber();
  },
  startEvolveResearch(sid, stage) {
    if (G.lab) return;
    const c = evolveCost(sid, stage);
    if (!spend({ coins: c.coins })) return;
    startLab({ type: 'evolve', species: sid, stage, start: now(), end: now() + c.time * 1000 });
    Sfx.amber();
  },
  rushLab() { if (!G.lab) return; if (spend({ bucks: speedCost(G.lab.end - now()) })) G.lab.end = now(); },
  claimLab() {
    const t = G.lab; if (!t || now() < t.end) return;
    finishLab();
    Sfx.mission();
    if (t.type === 'decode') {
      UI.toast(`🧬 ${SPECIES[t.species].name} DNA decoded! Available in the Market.`, 'good big', 4000);
      UI.advisor('quill', `The ${SPECIES[t.species].name} sequence is complete! You can now buy its egg in the Market.`);
    } else UI.toast(`★ ${SPECIES[t.species].name} ${STAGE_NAMES[t.stage]} researched! Evolve it from its paddock.`, 'good big', 4000);
    if (UI.modalKind === 'lab') UI.renderLab();
  },

  /* ---------- mission hints ---------- */
  hintFor(m) {
    const g = m.goal;
    const focusObj = pred => { const o = G.objects.find(pred); if (o) { Render.focusTile(o.x + o.w / 2, o.y + o.h / 2, 1.2); this.hint = { x: o.x + o.w / 2, y: o.y + o.h / 2, until: now() + 8000 }; } return o; };
    switch (g.type) {
      case 'collect_dino': case 'feed': case 'dino_level': case 'evolve': focusObj(o => o.type === 'paddock' && (!g.species || o.species === g.species)); break;
      case 'clear': {
        let best = null, bd = 1e9; const c = Render.s2t(Render.W / 2, Render.H / 2);
        for (let i = 0; i < World.obs.length; i++) if (World.obs[i]) { const x = i % MAP, y = Math.floor(i / MAP), d = Math.hypot(x - 24, y - 24); if (d < bd) { bd = d; best = { x, y }; } }
        if (best) { Render.focusTile(best.x + 0.5, best.y + 0.5, 1.3); this.hint = { x: best.x + 0.5, y: best.y + 0.5, until: now() + 8000 }; }
        break;
      }
      case 'build': case 'deco': UI.market(g.type === 'deco' ? 'decos' : 'buildings'); break;
      case 'buy_dino': case 'hatch': if (g.type === 'hatch' && focusObj(o => o.type === 'paddock' && o.hatchEnd > now())) break; UI.market('dinos'); break;
      case 'road': this.setMode('road'); break;
      case 'collect_food': focusObj(o => o.def === 'crop_harbor') || UI.market('buildings'); break;
      case 'decode': focusObj(o => o.def === 'lab'); break;
      case 'collect_shop': focusObj(o => BUILDINGS[o.def] && BUILDINGS[o.def].kind === 'shop'); break;
      case 'battle_win': case 'league': UI.arena(); break;
    }
  },

  /* ---------- simulation tick ---------- */
  tick(dt) {
    const nowT = now();
    for (const o of G.objects) {
      if (o.type === 'paddock') {
        if (o.hatchEnd <= nowT) {
          if (!o.hatched) {
            o.hatched = true;
            if (this.started && nowT - o.hatchEnd < 5000) {
              const c = World.toWorld(o.x + o.w / 2, o.y + o.h / 2);
              Entities.emit(c.x, c.y - 20, 'confetti', 30); Entities.emit(c.x, c.y - 10, 'star', 12);
              Sfx.hatch();
              UI.toast(`🥚 A baby ${SPECIES[o.species].name} has hatched!`, 'good big');
            }
            G.stats.hatched++;
            missionEvent('hatch', { species: o.species });
          }
          o.coins = Math.min(dinoCap(o), (o.coins || 0) + dinoRate(o) * dt / 60);
        }
      }
    }
    for (const job of [...G.clearing]) if (nowT >= job.end) this.finishClear(job);
    // world time
    const dayLen = 480;
    const dayT = window.FORCE_HOUR !== undefined ? window.FORCE_HOUR / 24 : G.settings.daynight ? ((nowT / 1000 / dayLen) + G.dayOffset) % 1 : 0.45;
    World.hour = dayT * 24;
    const h = World.hour;
    let night = 0;
    if (h >= 20 || h < 5) night = 1; else if (h >= 18) night = (h - 18) / 2; else if (h < 7) night = 1 - (h - 5) / 2;
    World.night = night;
    World.dusk = h >= 17 && h < 20 ? Math.sin((h - 17) / 3 * Math.PI) : h >= 5 && h < 7.5 ? Math.sin((h - 5) / 2.5 * Math.PI) * 0.7 : 0;
    Sfx.setNight && Sfx.ctx && Sfx.setNight(night);
    if (this.hint && now() > this.hint.until) this.hint = null;
  },
  applyOffline() {
    const dt = clamp((now() - (G.lastTick || now())) / 1000, 0, 3600 * 12);
    if (dt < 30) return;
    let coins = 0;
    for (const o of G.objects) if (o.type === 'paddock' && o.hatchEnd <= now()) { const before = o.coins || 0; o.coins = Math.min(dinoCap(o), before + dinoRate(o) * dt / 60); coins += o.coins - before; }
    if (coins > 10) setTimeout(() => UI.toast(`Welcome back! Your dinosaurs earned ${fmt(coins)} coins while you were away.`, 'good big', 5000), 1500);
  },
};

/* ==========================================================
   New park layout
   ========================================================== */
function setupNewPark() {
  G = newGameState();
  World.generate(G.seed);
  const place = (type, def, x, y) => { const o = makeObject(type, def, x, y); G.objects.push(o); return o; };
  place('building', 'gate', 23, 31);
  place('building', 'visitor_center', 25, 26);
  place('building', 'lab', 20, 26);
  place('building', 'crop_harbor', 20, 20);
  place('building', 'souvenir', 29, 22).start = now() - 45000;
  const trike = place('paddock', 'triceratops', 25, 18);
  trike.hatchEnd = now() - 1000; trike.hatchStart = now() - 20000; trike.level = 4; trike.coins = 120;
  const cropH = G.objects.find(o => o.def === 'crop_harbor');
  cropH.order = null;
  // roads
  for (let y = 19; y <= 30; y++) World.roads[World.idx(24, y)] = 1;
  for (let x = 19; x <= 29; x++) World.roads[World.idx(x, 24)] = 1;
  World.roads[World.idx(24, 31)] = 1;
  // decorations
  place('deco', 'flowers', 23, 29); place('deco', 'lamp', 25, 30); place('deco', 'torch', 22, 30); place('deco', 'palm', 29, 25);
  World.rebuildOcc(); recomputeBonuses();
}
function loadPark(s) {
  G = s;
  World.generate(G.seed);
  World.decode(G.roads, World.roads);
  World.decode(G.obs, World.obs);
  World.rebuildOcc(); recomputeBonuses();
}

/* ==========================================================
   Boot
   ========================================================== */
let lastFrame = performance.now(), tickAcc = 0;
function loop(ts) {
  const dt = Math.min(0.1, (ts - lastFrame) / 1000);
  lastFrame = ts;
  if (G) {
    Input.update(dt);
    tickAcc += dt;
    if (tickAcc > 0.1) { Game.tick(tickAcc); tickAcc = 0; }
    Entities.update(dt, Render.t);
    if (!Battle.active) Render.frame(dt);
    if (Game.hint && !Battle.active) drawHintArrow();
    Battle.update(dt);
    UI.refreshInfo(dt);
    if (UI.hudDirty || Math.floor(ts / 500) !== Math.floor((ts - dt * 1000) / 500)) { UI.hud(); UI.clock(); }
    if (Game.started && ts - Game.lastSave > 10000) { Game.lastSave = ts; saveGame(); }
    if (Game.started && Math.floor(ts / 1000) !== Math.floor((ts - dt * 1000) / 1000)) UI.renderTrackerSoft();
  }
  requestAnimationFrame(loop);
}
UI.renderTrackerSoft = function () {
  // refresh progress of state-based missions (visitors, level, ...)
  const sig = G.missions.active.map(id => { const m = MISSIONS.find(x => x.id === id); return missionProgress(m); }).join(',');
  if (sig !== this._trackSig) { this._trackSig = sig; this.renderTracker(); }
};
function drawHintArrow() {
  const ctx = Render.ctx, h = Game.hint;
  const w = World.toWorld(h.x, h.y), s = Render.w2s(w.x, w.y);
  const b = Math.abs(Math.sin(Render.t * 4)) * 14;
  ctx.save(); ctx.translate(s.x, s.y - 120 - b);
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#6a3a00'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-14, -30); ctx.lineTo(14, -30); ctx.lineTo(14, -8); ctx.lineTo(26, -8); ctx.lineTo(0, 20); ctx.lineTo(-26, -8); ctx.lineTo(-14, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

async function boot() {
  Render.init();
  await loadIconImages();
  if (document.fonts && document.fonts.ready) { try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (e) { /* ignore */ } }
  buildSprites();
  Input.init(); UI.init(); Battle.init();
  // background park for the title screen
  const saved = loadGame();
  if (saved) loadPark(saved); else setupNewPark();
  World.renderTerrain();
  Entities.syncDinos();
  Render.cam.x = World.toWorld(24, 24).x; Render.cam.y = World.toWorld(24, 24).y; Render.cam.zoom = 0.9;
  $('#btnContinue').classList.toggle('hidden', !saved);
  $('#btnNew').textContent = saved ? 'New Park' : 'Start Building';
  $('#btnContinue').addEventListener('click', () => startGame(false));
  $('#btnNew').addEventListener('click', () => {
    if (saved && !confirm('Start a new park? Your current park will be lost.')) return;
    if (saved) { wipeSave(); setupNewPark(); World.renderTerrain(); Entities.visitors = []; Entities.syncDinos(); }
    startGame(true);
  });
  requestAnimationFrame(loop);
  // title camera drift
  Game.titleDrift = true;
  (function drift() { if (!Game.titleDrift) return; Render.cam.x += Math.sin(performance.now() / 6000) * 0.25; requestAnimationFrame(drift); })();
}
function startGame(fresh) {
  Sfx.init();
  Sfx.setVolume(G.settings.vol); Sfx.setMusic(G.settings.music); Sfx.setAmbience(G.settings.ambience);
  Game.titleDrift = false;
  $('#title').classList.add('fade');
  setTimeout(() => $('#title').classList.add('hidden'), 800);
  $('#hud').classList.remove('hidden');
  Game.mode = 'normal'; Game.started = true;
  Game.applyOffline();
  Render.focusTile(25.5, 23, 1.05);
  if (!G.missions.active.length && G.missions.next === 0) {
    UI.advisor('vance', `Welcome to ${G.parkName}, Director! I'm Harriet Vance. The investors trust you to turn this wild island into the greatest dinosaur park in the world.`);
    UI.advisor('reyes', "Tomás Reyes, head ranger. The jungle here is thick – we'll clear it together. And don't worry, the fences are electrified.");
    UI.advisor('quill', "Dr. Mara Quill, genetics. Find me amber and I'll give you dinosaurs. Let's get started!", () => { Game.bulkFill = true; refillMissions(); Game.bulkFill = false; const m = MISSIONS[0]; UI.advisor(m.who, m.text); Game.hintFor(m); });
  } else refillMissions();
  UI.renderTracker();
  UI.hud();
  saveGame();
}
addEventListener('beforeunload', () => { if (Game.started) saveGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.started) saveGame(); });

// wire bus events to UI feedback
Bus.on('levelup', ({ level, reward }) => { UI.levelUp(level, reward); Bus.emit('missions'); });
Bus.on('newMission', m => { if (Game.started && !Game.bulkFill) { UI.advisor(m.who, m.text); Sfx.mission(); } });
Bus.on('decoded', () => { if (UI.modalKind === 'market') UI.renderMarket('dinos'); });
Bus.on('objects', () => Entities.syncDinos());

boot();

</script>
